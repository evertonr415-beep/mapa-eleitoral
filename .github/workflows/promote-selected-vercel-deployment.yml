name: Promote selected Vercel deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-selected-vercel-deployment.yml

permissions:
  contents: read

jobs:
  promote:
    if: github.event.head_commit.message == 'ops: promote selected Vercel deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No VERCEL_TOKEN or VERCEL_ACCESS_TOKEN repository secret is configured."
            exit 1
          fi

      - name: Promote exact deployment to production
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          npx --yes vercel@59.3.0 promote \
            dpl_CkEV93Gj394WmR3EYm55YcBm3gW7 \
            --yes \
            --scope evertonr415-1150s-projects \
            --token "$TOKEN"

      - name: Verify active production alias
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          npx --yes vercel@59.3.0 inspect \
            votofortearapongas-security-preview.vercel.app \
            --scope evertonr415-1150s-projects \
            --token "$TOKEN"
