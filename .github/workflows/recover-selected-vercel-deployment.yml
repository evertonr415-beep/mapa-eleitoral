name: Recover selected Vercel deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-selected-vercel-deployment.yml

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Fetch selected protected deployment
        id: fetch
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -uo pipefail
          STATUS=$(curl -sS \
            -D recovered-headers.txt \
            -o recovered-old.html \
            -w '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            'https://votofortearapongas-security-preview-3l0fa1ydj.vercel.app/')
          echo "HTTP status: $STATUS"
          wc -c recovered-old.html
          printf '%s' "$STATUS" > recovered-status.txt
          if [ "$STATUS" != "200" ]; then
            echo "::error::The protected deployment did not accept the GitHub OIDC token."
            exit 1
          fi

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-vercel-deployment-recovery
          path: |
            recovered-old.html
            recovered-headers.txt
            recovered-status.txt
          if-no-files-found: warn
          retention-days: 1
