name: One-off fix Lideranca label

on:
  push:
    branches:
      - security/hardening-2026-09-03
    paths:
      - .github/workflows/oneoff-fix-lideranca-label.yml

permissions:
  contents: write

jobs:
  fix-label:
    if: github.ref == 'refs/heads/security/hardening-2026-09-03'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-2026-09-03
          fetch-depth: 0

      - name: Replace only the duplicated text marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<span>+ Liderança</span>'
          new = '<span>Liderança</span>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html

      - name: Commit the one-line fix
        shell: bash
        run: |
          git config user.name 'openai-preview-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: remove duplicated plus from leadership button'
          git push origin HEAD:security/hardening-2026-09-03
