name: Recover and publish selected Vercel deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-and-publish-selected-deployment.yml

permissions:
  contents: write

jobs:
  recover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact selected deployment HTML
        shell: bash
        run: |
          set -euo pipefail
          URL='https://votofortearapongas-security-preview.vercel.app/?dpl=dpl_CkEV93Gj394WmR3EYm55YcBm3gW7&recovery=exact-selected-version'
          curl --compressed --fail --silent --show-error --location --retry 3 "$URL" --output recovered-selected.html

          SIZE=$(wc -c < recovered-selected.html | tr -d ' ')
          SHA=$(sha256sum recovered-selected.html | awk '{print $1}')
          echo "Recovered bytes: $SIZE"
          echo "Recovered SHA-256: $SHA"

          if [ "$SIZE" -lt 70000 ]; then
            echo "::error::Recovered document is unexpectedly small."
            exit 1
          fi
          grep -Fq 'mapa-eleitoral@82a79e82ed09b62ae8db55e6a6e30b73ee7a2573' recovered-selected.html
          grep -Fq 'MAPA ELEITORAL 2024' recovered-selected.html

          mv recovered-selected.html index.html

      - name: Commit exact recovered version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'evertonr415-beep'
          git config user.email 'evertonr415@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Selected deployment HTML is already published.'
            exit 0
          fi
          git commit -m 'publish: exact selected Vercel version 3l0fa1ydj'
          git push origin HEAD:main
