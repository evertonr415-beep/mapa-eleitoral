name: Recover TSE full vote data v19

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - 'scripts/recover_tse_votes.py'
      - '.github/workflows/recover-tse-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official TSE JSON sources
        run: |
          set -x
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/pr24.json 'https://resultados.tse.jus.br/oficial/ele2024/arquivo-urna/452/config/pr/pr-p000452-cs.json'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/pr22.json 'https://resultados.tse.jus.br/oficial/ele2022/arquivo-urna/406/config/pr/pr-p000406-cs.json'
          python - <<'PY'
          import json
          for year,path in [(2024,'/tmp/pr24.json'),(2022,'/tmp/pr22.json')]:
            d=json.load(open(path))
            found=[]
            for abr in d.get('abr',[]):
              for mu in abr.get('mu',[]):
                if 'ARAPONGAS' in mu.get('nm','').upper(): found.append(mu)
            print('YEAR',year,'FOUND',json.dumps(found,ensure_ascii=False)[:20000])
          PY
      - name: Reconstruct votes from official TSE JSON data
        run: python scripts/recover_tse_votes.py
      - name: Show validation report
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tse-full-data-v19-report.json',encoding='utf-8'))
          print(json.dumps(r,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Commit reconstructed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tse-full-data-v19.js tse-full-data-v19-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'data v19: reconstruct full TSE votes by polling place'
            git push origin HEAD:recovery-tse-full-data-20260906
          fi
