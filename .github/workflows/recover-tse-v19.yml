name: Recover TSE full vote data v19

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - 'scripts/recover_tse_votes.py'
      - '.github/workflows/recover-tse-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder
        run: python -m pip install --quiet asn1tools
      - name: Reconstruct all votes from official TSE ballot-box BUs
        run: python scripts/recover_tse_votes.py
      - name: Validate generated report
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tse-full-data-v19-report.json',encoding='utf-8'))
          assert r['sections_2024']==r['sections_2024_processed']
          assert r['sections_2022']==r['sections_2022_processed']
          assert r['tse_locals_2024']==29
          assert all(v==29 for v in r['coverage'].values())
          print('VALIDATED: all recovered candidates have 29/29 polling places')
          print(json.dumps({'totals_2024':r['totals_2024'],'totals_2022':r['totals_2022']},ensure_ascii=False,indent=2))
          PY
      - name: Commit reconstructed official data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tse-full-data-v19.js tse-full-data-v19-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'data v19: restore complete official TSE polling-place votes'
            git push origin HEAD:recovery-tse-full-data-20260906
          fi
