name: Recover TSE full vote data v19

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - 'scripts/recover_tse_votes.py'
      - '.github/workflows/recover-tse-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official TSE and TRE sources
        run: |
          set -x
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/v22.zip 'https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2022_PR.zip'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/v24.zip 'https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2024_PR.zip'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/loc24 'https://www.tre-pr.jus.br/eleicoes/estatisticas/arquivos/tre-pr-elo-cadastro-eleitoral-enderecos-das-secoes-do-parana-2024'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/loc22 'https://www.tre-pr.jus.br/eleicoes/estatisticas/arquivos/tre-pr-elo-cadastro-eleitoral-enderecos-das-secoes-do-parana-2022'
          file /tmp/v22.zip /tmp/v24.zip /tmp/loc24 /tmp/loc22
          unzip -l /tmp/v22.zip | head -20
          unzip -l /tmp/v24.zip | head -20
          if command -v pdftotext >/dev/null 2>&1; then
            pdftotext -layout /tmp/loc24 /tmp/loc24.txt || true
            pdftotext -layout /tmp/loc22 /tmp/loc22.txt || true
            grep -in -A 80 -B 10 'ARAPONGAS' /tmp/loc24.txt | head -220 || true
            grep -in -A 80 -B 10 'ARAPONGAS' /tmp/loc22.txt | head -220 || true
          fi
      - name: Reconstruct votes from official TSE open data
        run: python scripts/recover_tse_votes.py
      - name: Show validation report
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tse-full-data-v19-report.json',encoding='utf-8'))
          print(json.dumps({
            'missing_2024':r['missing_2024'],
            'missing_2022':r['missing_2022'],
            'mapped_2024':len(r['mapping_2024']),
            'mapped_2022':len(r['mapping_2022']),
            'totals_2024':r['totals_2024'],
            'totals_2022':r['totals_2022']
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit reconstructed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tse-full-data-v19.js tse-full-data-v19-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'data v19: reconstruct full TSE votes by polling place'
            git push origin HEAD:recovery-tse-full-data-20260906
          fi
