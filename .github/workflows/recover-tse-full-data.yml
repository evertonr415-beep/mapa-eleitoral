name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
      - 'scripts/recover_tse_data.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Set official TSE resource URLs
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          VOTE_2024_URL=https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2024_PR.zip
          VOTE_2022_URL=https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2022_PR.zip
          LOCAL_2024_URL=https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_local_votacao/eleitorado_local_votacao_2024.zip
          LOCAL_2022_URL=https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_2022.zip
          EOF
          cat > tse-source-urls.json <<'EOF'
          {
            "VOTE_2024_URL": "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2024_PR.zip",
            "VOTE_2022_URL": "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2022_PR.zip",
            "LOCAL_2024_URL": "https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_local_votacao/eleitorado_local_votacao_2024.zip",
            "LOCAL_2022_URL": "https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_2022.zip"
          }
          EOF

      - name: Download official TSE datasets
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -A "$UA" --fail --location --retry 4 --retry-delay 3 "$VOTE_2024_URL" -o /tmp/vote2024.zip
          curl -A "$UA" --fail --location --retry 4 --retry-delay 3 "$VOTE_2022_URL" -o /tmp/vote2022.zip
          if ! curl -A "$UA" --fail --location --retry 3 --retry-delay 2 "$LOCAL_2024_URL" -o /tmp/local2024.zip; then
            LOCAL_2024_URL='https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_2024.zip'
            curl -A "$UA" --fail --location --retry 4 --retry-delay 3 "$LOCAL_2024_URL" -o /tmp/local2024.zip
          fi
          curl -A "$UA" --fail --location --retry 4 --retry-delay 3 "$LOCAL_2022_URL" -o /tmp/local2022.zip
          unzip -t /tmp/vote2024.zip >/dev/null
          unzip -t /tmp/vote2022.zip >/dev/null
          unzip -t /tmp/local2024.zip >/dev/null
          unzip -t /tmp/local2022.zip >/dev/null

      - name: Reconstruct Arapongas 29-college dataset
        run: |
          python scripts/recover_tse_data.py \
            app.js \
            /tmp/vote2024.zip \
            /tmp/vote2022.zip \
            /tmp/local2024.zip \
            /tmp/local2022.zip \
            tse-full-data-v19.js \
            tse-full-data-report.json

      - name: Validate recovered dataset
        shell: python
        run: |
          import json
          r=json.load(open('tse-full-data-report.json',encoding='utf-8'))
          print('ready=',r['ready'])
          print('recovered=',r['recovered_candidate_count'],'of',r['system_candidate_count'])
          review={k:v for k,v in r['candidates'].items() if v.get('status')!='ok'}
          print('review=',json.dumps(review,ensure_ascii=False,indent=2))
          if not r['ready']:
              raise SystemExit('TSE reconstruction did not pass validation; no false complete dataset will be published.')

      - name: Commit validated full dataset to recovery branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-full-data-v19.js tse-full-data-report.json tse-source-urls.json
          if git diff --cached --quiet; then
            echo "No recovered-data changes to commit."
            exit 0
          fi
          git commit -m "recovery: rebuild complete Arapongas vote distribution from official TSE section data"
          git push origin HEAD:recovery-tse-full-data-20260906
