name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
      - 'scripts/recover_tse_static.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Probe TSE BUWeb decoded CSVs for Paraná
        shell: python
        run: |
          import json, pathlib, urllib.request, urllib.error, zipfile, io
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'*/*'}
          urls={
            '2022':'https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2022/buweb/bweb_1t_PR_051020221321.zip',
            '2024':'https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2024/buweb/bweb_1t_PR_091020241636.zip'
          }
          out={}
          for year,url in urls.items():
              rec={'url':url}
              try:
                  req=urllib.request.Request(url,headers=H)
                  with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
                  rec['status']=200;rec['zip_size']=len(data)
                  z=zipfile.ZipFile(io.BytesIO(data))
                  rec['files']=[{'name':x.filename,'size':x.file_size} for x in z.infolist()]
                  csvs=[x for x in z.infolist() if x.filename.lower().endswith('.csv')]
                  if csvs:
                      x=max(csvs,key=lambda a:a.file_size)
                      raw=z.open(x).read(30000)
                      text=raw.decode('latin-1',errors='replace')
                      lines=text.splitlines()
                      rec['csv_name']=x.filename
                      rec['head']=lines[:6]
                      rec['header']=lines[0].split(';') if lines else []
              except urllib.error.HTTPError as e:
                  rec['status']=e.code;rec['error']=str(e)
              except Exception as e:
                  rec['status']='error';rec['error']=repr(e)
              out[year]=rec
              print(year,rec.get('status'),rec.get('zip_size'),rec.get('csv_name'))
          pathlib.Path('tse-buweb-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Commit BUWeb probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-buweb-probe.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: probe decoded TSE BUWeb Paraná datasets"
          git push origin HEAD:recovery-tse-full-data-20260906
