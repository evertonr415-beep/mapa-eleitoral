name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Probe official TSE municipal candidate JSON
        shell: python
        run: |
          import json,pathlib,urllib.request,urllib.error
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          urls={
            'fed2022':'https://resultados.tse.jus.br/oficial/ele2022/544/dados/pr/pr74276-c0006-e000544-v.json',
            'est2022':'https://resultados.tse.jus.br/oficial/ele2022/544/dados/pr/pr74276-c0007-e000544-v.json',
            'ver2024':'https://resultados.tse.jus.br/oficial/ele2024/619/dados/pr/pr74276-c0013-e000619-v.json'
          }
          out={}
          for key,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers=H)
                  with urllib.request.urlopen(req,timeout=90) as r:
                      data=json.load(r)
                  out[key]={'url':url,'status':200,'top_keys':list(data.keys()) if isinstance(data,dict) else None,'data':data}
                  print(key,200,list(data.keys()) if isinstance(data,dict) else type(data).__name__)
              except urllib.error.HTTPError as e:
                  out[key]={'url':url,'status':e.code,'error':str(e)};print(key,e.code)
              except Exception as e:
                  out[key]={'url':url,'status':'error','error':repr(e)};print(key,repr(e))
          pathlib.Path('tse-candidate-json-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Commit candidate JSON probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-candidate-json-probe.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: inspect official Arapongas candidate totals and numbers"
          git push origin HEAD:recovery-tse-full-data-20260906
