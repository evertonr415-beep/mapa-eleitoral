name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
      - 'scripts/recover_tse_static.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Probe official TSE static result service
        shell: python
        run: |
          import json, urllib.request, unicodedata

          BASE='https://resultados.tse.jus.br/oficial'
          UA={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          def norm(v):
              s=unicodedata.normalize('NFKD',str(v or ''))
              s=''.join(c for c in s if not unicodedata.combining(c))
              return ' '.join(s.upper().split())
          def find_arapongas(obj):
              found=[]
              def walk(v,path='root'):
                  if isinstance(v,dict):
                      blob=' '.join(str(x) for x in v.values() if isinstance(x,(str,int,float)))
                      if 'ARAPONGAS' in norm(blob): found.append({'path':path,'value':v})
                      for k,x in v.items(): walk(x,path+'.'+str(k))
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,path+'['+str(i)+']')
              walk(obj)
              return found

          probe={}
          urls={
            'mun2022':BASE+'/ele2022/544/config/mun-e000544-cm.json',
            'mun2024':BASE+'/ele2024/619/config/mun-e000619-cm.json',
            'sections2022':BASE+'/ele2022/arquivo-urna/406/config/pr/pr-p000406-cs.json',
            'sections2024':BASE+'/ele2024/arquivo-urna/452/config/pr/pr-p000452-cs.json'
          }
          for key,url in urls.items():
              print('fetch',key,url)
              data=get(url)
              hits=find_arapongas(data)
              probe[key]={'url':url,'hits':hits,'top_keys':list(data.keys()) if isinstance(data,dict) else None,'type':type(data).__name__}
              print(key,'hits',len(hits))
          open('tse-static-probe.json','w',encoding='utf-8').write(json.dumps(probe,ensure_ascii=False,indent=2))

      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-static-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: probe TSE static section service for Arapongas"
          git push origin HEAD:recovery-tse-full-data-20260906
