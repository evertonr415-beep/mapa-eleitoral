name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
      - 'scripts/recover_tse_static.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Install decoder
        run: python -m pip install --quiet asn1tools

      - name: Tolerate configured section with no published 2024 BU
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/recover_tse_static.py')
          s=p.read_text(encoding='utf-8')
          old="""    def work24(sec):\n        raw,aux,bu = fetch_bu(2024,'452',sec)\n        local,_ = extract_envelope_location(conv,raw)\n        votes,hits = extract_2024_candidate_votes(conv.decode('EntidadeEnvelopeGenerico',raw)['conteudo'])\n        return sec,local,votes,hits,aux,bu\n"""
          new="""    def work24(sec):\n        try:\n            raw,aux,bu = fetch_bu(2024,'452',sec)\n        except urllib.error.HTTPError as e:\n            if e.code == 404:\n                return sec,0,{},0,'',''\n            raise\n        local,_ = extract_envelope_location(conv,raw)\n        votes,hits = extract_2024_candidate_votes(conv.decode('EntidadeEnvelopeGenerico',raw)['conteudo'])\n        return sec,local,votes,hits,aux,bu\n"""
          if old not in s:
              raise SystemExit('work24 patch target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

      - name: Rebuild Arapongas vote matrix from official TSE section bulletins
        run: python scripts/recover_tse_static.py app.js tse-full-data-v19.js tse-full-data-report.json

      - name: Validate generated overlay
        shell: python
        run: |
          import json, pathlib
          r=json.loads(pathlib.Path('tse-full-data-report.json').read_text(encoding='utf-8'))
          assert r.get('ready') is True
          assert r.get('recovered_candidate_count') == 41
          bad={k:v for k,v in r['audit'].items() if v.get('status')!='ok'}
          assert not bad, bad
          print(json.dumps({'ready':True,'recovered':41,'sections':r['sections'],'downloads':r['download_count']},ensure_ascii=False,indent=2))

      - name: Commit validated official dataset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-full-data-v19.js tse-full-data-report.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "recovery: restore complete 29-location vote matrix from official TSE BUs"
          git push origin HEAD:recovery-tse-full-data-20260906
