name: Recover TSE full electoral data

on:
  push:
    branches:
      - recovery-tse-full-data-20260906
    paths:
      - '.github/workflows/recover-tse-full-data.yml'
      - 'scripts/recover_tse_static.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-tse-full-data-20260906
          fetch-depth: 0

      - name: Probe one official TSE section in 2022 and 2024
        shell: python
        run: |
          import json, urllib.request, urllib.error
          BASE='https://resultados.tse.jus.br/oficial'
          HEAD={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def fetch(url):
              req=urllib.request.Request(url,headers=HEAD)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read()
                      return {'status':r.status,'content_type':r.headers.get('content-type',''),'body':body}
              except urllib.error.HTTPError as e:
                  return {'status':e.code,'content_type':e.headers.get('content-type',''),'body':e.read()}
          out={}
          for year,pleito in [(2022,'406'),(2024,'452')]:
              d=f'{BASE}/ele{year}/arquivo-urna/{pleito}/dados/pr/74276/0061/0299'
              b=f'p000{pleito}-pr-m74276-z0061-s0299'
              auxurl=f'{d}/{b}-aux.json'
              a=fetch(auxurl)
              rec={'aux_url':auxurl,'aux_status':a['status'],'aux_type':a['content_type']}
              if a['status']==200:
                  try:
                      aux=json.loads(a['body'].decode('utf-8'))
                      rec['aux']=aux
                      hashes=aux.get('hashes') or []
                      rec['hashes_summary']=[{'hash':x.get('hash'),'nmarq':x.get('nmarq'),'st':x.get('st')} for x in hashes]
                  except Exception as e: rec['aux_parse_error']=repr(e)
              tests=[]
              for suffix in ['-bu.json','.json','-v.json']:
                  u=f'{d}/{b}{suffix}'
                  x=fetch(u)
                  item={'url':u,'status':x['status'],'content_type':x['content_type'],'size':len(x['body'])}
                  if x['status']==200 and 'json' in x['content_type'].lower():
                      try:
                          j=json.loads(x['body'].decode('utf-8'))
                          item['top_keys']=list(j.keys()) if isinstance(j,dict) else None
                          item['sample']=j
                      except Exception as e: item['parse_error']=repr(e)
                  tests.append(item)
              rec['structured_tests']=tests
              out[str(year)]=rec
          open('tse-section-probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))

      - name: Commit section probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tse-section-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: inspect official TSE section bulletin structure"
          git push origin HEAD:recovery-tse-full-data-20260906
