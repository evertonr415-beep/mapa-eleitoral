name: Import local politician photos v27.6

on:
  push:
    branches:
      - preview-politician-photos-v27
    paths:
      - 'scripts/import_profile_photos.py'
      - 'scripts/import_remaining_photos.py'
      - '.github/workflows/import-profile-photos-v27.yml'

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-politician-photos-v27

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import first 35 validated photos
        continue-on-error: true
        run: python scripts/import_profile_photos.py

      - name: Import final eight validated photos
        run: python scripts/import_remaining_photos.py

      - name: Verify complete 43-photo manifest
        run: |
          python - <<'PY'
          import json
          p='assets/politicians/photos.json'
          data=json.load(open(p,encoding='utf-8'))
          print('Validated local politician photos:',len(data))
          if len(data)!=43:
              raise SystemExit(f'Expected 43 photos, got {len(data)}')
          PY

      - name: Show import reports
        if: always()
        run: |
          if [ -f assets/politicians/profile-import-report.json ]; then cat assets/politicians/profile-import-report.json; fi
          if [ -f assets/politicians/remaining-import-report.json ]; then cat assets/politicians/remaining-import-report.json; fi
          if [ -f assets/politicians/photos.json ]; then cat assets/politicians/photos.json; fi

      - name: Commit local politician photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/politicians
          if git diff --cached --quiet; then
            echo 'No photo changes to commit.'
            exit 0
          fi
          git commit -m 'preview v27.6: store all 43 validated politician photos locally'
          git pull --rebase origin preview-politician-photos-v27
          git push origin HEAD:preview-politician-photos-v27
