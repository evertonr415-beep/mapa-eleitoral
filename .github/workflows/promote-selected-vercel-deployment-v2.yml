name: Promote selected Vercel deployment v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-selected-vercel-deployment-v2.yml

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Promote exact deployment to production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in the repository."
            exit 1
          fi
          npx --yes vercel@59.3.0 promote dpl_CkEV93Gj394WmR3EYm55YcBm3gW7 --yes --scope evertonr415-1150s-projects --token "$VERCEL_TOKEN"

      - name: Verify production alias
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.3.0 inspect votofortearapongas-security-preview.vercel.app --scope evertonr415-1150s-projects --token "$VERCEL_TOKEN"
