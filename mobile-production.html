<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Mapa Eleitoral</title><style>html,body{margin:0;height:100%;background:#080d17;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}</style></head><body>Verificando acesso...<script type="module">import{requireAuth,currentUser,signOut}from'./auth-gate.js';const u=await requireAuth();if(u){const secureLogout=async()=>{if(!confirm('Deseja realmente sair da sua conta?'))return;try{await signOut()}catch(_){location.replace('./?login=1')}};try{Object.defineProperty(window,'handleLogout',{configurable:false,get(){return secureLogout},set(){}})}catch(_){window.handleLogout=secureLogout}setInterval(async()=>{if(document.hidden)return;const ok=await currentUser();if(!ok)location.replace('./?login=1')},60000);try{const base='https://cdn.jsdelivr.net/gh/evertonr415-beep/mapa-eleitoral@5a210ba04ebe66866bdd1876592ca1634d09e514/';const r=await fetch(base+'mobile-production.html',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const h=await r.text();document.open();document.write(h);document.close()}catch(e){document.body.textContent='Não foi possível carregar o sistema.'}}</script></body></html>
