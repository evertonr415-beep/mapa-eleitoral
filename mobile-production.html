<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Mapa Eleitoral</title><style>html,body{margin:0;height:100%;background:#080d17;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}</style></head><body>Verificando acesso...<script type="module">import{requireAuth,currentUser,signOut}from'./auth-gate.js';const u=await requireAuth();if(u){const secureLogout=async()=>{if(!confirm('Deseja realmente sair da sua conta?'))return;try{await signOut()}catch(_){location.replace('./?login=1')}};try{Object.defineProperty(window,'handleLogout',{configurable:false,get(){return secureLogout},set(){}})}catch(_){window.handleLogout=secureLogout}setInterval(async()=>{if(document.hidden)return;const ok=await currentUser();if(!ok)location.replace('./?login=1')},60000);try{const base='https://cdn.jsdelivr.net/gh/evertonr415-beep/mapa-eleitoral@5a210ba04ebe66866bdd1876592ca1634d09e514/';const r=await fetch(base+'mobile-production.html',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let h=await r.text();const marker="var scripts='<scr'+'ipt";const inject="head+='<link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-leadership-modal-compact.css?v=11\"><link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-menu-cleanup-v12.css?v=12\"><link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-drawer-compact-v13.css?v=13\"><link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-menu-arapongas-v14.css?v=14\"><link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-menu-refine-v15.css?v=15\"><link rel=\"stylesheet\" href=\"'+location.origin+'/mobile-map-filters-v16.css?v=16\">';var scripts='<scr'+'ipt src=\"'+location.origin+'/mobile-menu-refine-v15.js?v=15\"></scr'+'ipt><scr'+'ipt src=\"'+location.origin+'/mobile-map-filters-v16.js?v=16\"></scr'+'ipt><scr'+'ipt";if(h.includes(marker)){h=h.replace(marker,inject)}else{const css='<link rel="stylesheet" href="'+location.origin+'/mobile-leadership-modal-compact.css?v=11"><link rel="stylesheet" href="'+location.origin+'/mobile-menu-cleanup-v12.css?v=12"><link rel="stylesheet" href="'+location.origin+'/mobile-drawer-compact-v13.css?v=13"><link rel="stylesheet" href="'+location.origin+'/mobile-menu-arapongas-v14.css?v=14"><link rel="stylesheet" href="'+location.origin+'/mobile-menu-refine-v15.css?v=15"><link rel="stylesheet" href="'+location.origin+'/mobile-map-filters-v16.css?v=16">';const js='<scr'+'ipt src="'+location.origin+'/mobile-menu-refine-v15.js?v=15"></scr'+'ipt><scr'+'ipt src="'+location.origin+'/mobile-map-filters-v16.js?v=16"></scr'+'ipt>';h=h.replace('</head>',css+'</head>');h=h.replace('</body>',js+'</body>')}document.open();document.write(h);document.close()}catch(e){document.body.textContent='Não foi possível carregar o sistema.'}}</script></body></html>
