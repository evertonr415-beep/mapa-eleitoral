<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Mapa Eleitoral</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e5edf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:linear-gradient(180deg,#101a2b,#0c1422);border:1px solid #22324a;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{width:54px;height:54px;border-radius:14px;background:#18253a;display:grid;place-items:center;font-weight:800;color:#60a5fa;border:1px solid #2b3e5d}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#8fa1ba;font-size:13px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:700;color:#9fb0c7;margin-bottom:6px}.field input{width:100%;height:48px;border-radius:12px;border:1px solid #2b3b54;background:#0a1220;color:#fff;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#3b82f6}.btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:800;font-size:15px;margin-top:18px}.btn:disabled{opacity:.6}.status{min-height:20px;margin-top:12px;font-size:12px;color:#fda4af}.foot{margin-top:18px;text-align:center;color:#64748b;font-size:11px}.loading{display:none;text-align:center;color:#94a3b8;font-size:13px}.loading.show{display:block}.login.hide{display:none}</style></head><body><main class="card"><div class="brand"><div class="logo">VF</div><div><h1>Mapa Eleitoral</h1><p>Acesso restrito</p></div></div><section id="loading" class="loading show">Verificando sua sessão...</section><section id="login" class="login hide"><form id="form"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" class="btn" type="submit">Entrar</button><div id="status" class="status"></div></form></section><div class="foot">Somente usuários autorizados podem acessar o sistema.</div></main><script type="module">import{currentUser,signIn,route}from'./auth-gate.js';const loading=document.getElementById('loading'),login=document.getElementById('login'),form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit');const u=await currentUser();if(u){route()}else{loading.classList.remove('show');login.classList.remove('hide')}form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';submit.disabled=true;submit.textContent='Entrando...';try{await signIn(document.getElementById('email').value,document.getElementById('password').value);route()}catch(err){status.textContent=err?.message||'Não foi possível entrar.';submit.disabled=false;submit.textContent='Entrar'}});</script></body></html>
