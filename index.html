<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>VotoForte Arapongas</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e5edf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:linear-gradient(180deg,#101a2b,#0c1422);border:1px solid #22324a;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{width:54px;height:54px;border-radius:14px;background:#18253a;display:grid;place-items:center;font-weight:800;color:#60a5fa;border:1px solid #2b3e5d}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#8fa1ba;font-size:13px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:700;color:#9fb0c7;margin-bottom:6px}.input-wrap{position:relative}.field input{width:100%;height:48px;border-radius:12px;border:1px solid #2b3b54;background:#0a1220;color:#fff;padding:0 14px;font-size:16px;outline:none}.input-wrap input{padding-right:52px}.field input:focus{border-color:#3b82f6}.eye{position:absolute;right:4px;top:4px;width:42px;height:40px;border:0;background:transparent;color:#8fa1ba;border-radius:10px;display:grid;place-items:center;font-size:20px}.eye:active{background:#152238}.forgot{display:flex;justify-content:flex-end;margin-top:10px}.forgot button{border:0;background:transparent;color:#60a5fa;font-size:13px;font-weight:700;padding:4px 0}.btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:800;font-size:15px;margin-top:18px}.btn:disabled{opacity:.6}.status{min-height:20px;margin-top:12px;font-size:12px;color:#fda4af}.status.ok{color:#6ee7b7}.foot{margin-top:18px;text-align:center;color:#64748b;font-size:11px;line-height:1.45}.loading{display:none;text-align:center;color:#94a3b8;font-size:13px}.loading.show{display:block}.login.hide{display:none}.reset-box{display:none}.reset-box.show{display:block}.reset-copy{color:#9fb0c7;font-size:13px;line-height:1.5;margin:0 0 8px}.back{border:0;background:transparent;color:#94a3b8;font-size:13px;font-weight:700;padding:10px 0 0}.back:hover{color:#fff}</style></head><body><main class="card"><div class="brand"><div class="logo">VF</div><div><h1>VotoForte Arapongas</h1><p>Acesso restrito</p></div></div><section id="loading" class="loading show">Verificando sua sessão...</section><section id="login" class="login hide"><form id="form"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="togglePass" class="eye" type="button" aria-label="Mostrar senha">◉</button></div></div><div class="forgot"><button id="forgotBtn" type="button">Esqueceu a senha?</button></div><button id="submit" class="btn" type="submit">Entrar</button><div id="status" class="status"></div></form></section><section id="resetBox" class="reset-box"><p class="reset-copy">Informe o e-mail cadastrado. Enviaremos um link seguro para você criar uma nova senha.</p><form id="resetForm"><div class="field"><label for="resetEmail">E-mail cadastrado</label><input id="resetEmail" type="email" autocomplete="email" required></div><button id="resetSubmit" class="btn" type="submit">Enviar link de recuperação</button><div id="resetStatus" class="status"></div><button id="backBtn" class="back" type="button">← Voltar para o login</button></form></section><div class="foot">Somente usuários autorizados podem acessar o sistema.</div></main><script type="module">import{currentUser,signIn,sendPasswordReset,route}from'./auth-gate.js';const loading=document.getElementById('loading'),login=document.getElementById('login'),form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit'),password=document.getElementById('password'),togglePass=document.getElementById('togglePass'),forgotBtn=document.getElementById('forgotBtn'),resetBox=document.getElementById('resetBox'),resetForm=document.getElementById('resetForm'),resetEmail=document.getElementById('resetEmail'),resetStatus=document.getElementById('resetStatus'),resetSubmit=document.getElementById('resetSubmit'),backBtn=document.getElementById('backBtn');const u=await currentUser();if(u){route()}else{loading.classList.remove('show');login.classList.remove('hide')}togglePass.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';togglePass.textContent=show?'◎':'◉';togglePass.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha')});forgotBtn.addEventListener('click',()=>{resetEmail.value=document.getElementById('email').value;login.classList.add('hide');resetBox.classList.add('show');setTimeout(()=>resetEmail.focus(),50)});backBtn.addEventListener('click',()=>{resetBox.classList.remove('show');login.classList.remove('hide');resetStatus.textContent='';resetStatus.className='status'});form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';submit.disabled=true;submit.textContent='Entrando...';try{await signIn(document.getElementById('email').value,password.value);route()}catch(err){status.textContent=err?.message||'Não foi possível entrar.';submit.disabled=false;submit.textContent='Entrar'}});resetForm.addEventListener('submit',async e=>{e.preventDefault();resetStatus.textContent='';resetStatus.className='status';resetSubmit.disabled=true;resetSubmit.textContent='Enviando...';try{await sendPasswordReset(resetEmail.value);resetStatus.textContent='Se o e-mail estiver cadastrado, você receberá um link de recuperação em instantes.';resetStatus.className='status ok'}catch(err){resetStatus.textContent=err?.message||'Não foi possível enviar o link agora.'}finally{resetSubmit.disabled=false;resetSubmit.textContent='Enviar link de recuperação'}});</script></body></html>
