<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Definir nova senha · VotoForte</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e5edf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:linear-gradient(180deg,#101a2b,#0c1422);border:1px solid #22324a;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}h1{font-size:21px;margin:0 0 8px}.copy{color:#95a7c0;font-size:13px;line-height:1.5;margin-bottom:18px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.22);color:#fbbf24;font-size:11px;font-weight:800;margin-bottom:14px}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:700;color:#9fb0c7;margin-bottom:6px}.field input{width:100%;height:48px;border-radius:12px;border:1px solid #2b3b54;background:#0a1220;color:#fff;padding:0 14px;font-size:16px;outline:none}.btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:800;font-size:15px;margin-top:18px}.status{min-height:20px;margin-top:12px;font-size:12px;color:#fda4af;line-height:1.45}</style></head><body><main class="card"><span class="tag">Senha temporária</span><h1>Crie sua nova senha</h1><p class="copy">O administrador liberou seu acesso com uma senha temporária. Antes de continuar, defina uma senha pessoal com pelo menos 8 caracteres.</p><form id="form"><div class="field"><label for="p1">Nova senha</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="p2">Confirmar nova senha</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div><button id="btn" class="btn" type="submit">Salvar nova senha</button><div id="status" class="status"></div></form></main><script type="module">import{currentUser,updatePassword,route}from'./auth-gate.js';const u=await currentUser();if(!u){location.replace('./?login=1')}else if(!u.vfProfile?.troca_senha_obrigatoria){route(u)}const form=document.getElementById('form'),btn=document.getElementById('btn'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b){status.textContent='As senhas não coincidem.';return}btn.disabled=true;btn.textContent='Salvando...';status.textContent='';try{await updatePassword(a);const next=await currentUser();route(next)}catch(err){status.textContent=err?.message||'Não foi possível alterar a senha.';btn.disabled=false;btn.textContent='Salvar nova senha'}});</script></body></html>
