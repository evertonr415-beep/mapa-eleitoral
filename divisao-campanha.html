<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Divisão Campanha</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:18px}.wrap{max-width:1050px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:#93a4bd;text-decoration:none;font-weight:700}.top h1{font-size:22px;margin:0}.total{font-size:12px;color:#8ea0b9}.mapbox{margin:18px auto 12px;max-width:650px;min-height:300px;display:grid;place-items:center}.mapbox img{display:block;width:100%;max-height:58vh;object-fit:contain}.map-fallback{display:none;color:#64748b;text-align:center}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0}.r{border-radius:16px;padding:13px 10px;background:#101a2a;border:1px solid #22324a}.r i{display:block;width:12px;height:12px;border-radius:50%;margin-bottom:8px}.r span{font-size:11px;color:#91a2b9}.r strong{display:block;font-size:23px;margin-top:3px}.n i,.dot.n{background:#29a7e8}.o i,.dot.o{background:#a62ad9}.l i,.dot.l{background:#32b85e}.s i,.dot.s{background:#ff7718}.c i,.dot.c{background:#ffd127}.peopleBtn{width:100%;border:1px solid #2b405e;background:#101b2d;color:#fff;border-radius:16px;padding:15px;font-size:16px;font-weight:800}.panel{display:none;margin-top:12px;background:#0e1726;border:1px solid #22324a;border-radius:18px;overflow:hidden}.panel.show{display:block}.filters{padding:12px;display:flex;gap:8px}.filters input,.filters select{min-width:0;flex:1;background:#091321;color:#fff;border:1px solid #293b56;border-radius:11px;padding:11px;font-size:14px}.list{max-height:48vh;overflow:auto}.person{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:12px;border-top:1px solid #1d2a3e}.dot{width:12px;height:12px;border-radius:50%}.person strong{display:block;font-size:14px}.person small{display:block;color:#8496ae;font-size:11px;margin-top:3px}.wa{color:#6ee7b7;text-decoration:none;font-size:12px;font-weight:800}.empty{padding:24px;text-align:center;color:#7f91aa}.status{text-align:center;color:#91a2b9;font-size:13px;padding:30px}@media(max-width:650px){body{padding:14px 11px}.top h1{font-size:19px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.r{padding:10px 5px;border-radius:12px}.r span{font-size:9px}.r strong{font-size:19px}.mapbox{min-height:260px;margin-top:10px}.filters{flex-direction:column}.person{grid-template-columns:16px 1fr auto}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="javascript:history.back()">‹ Voltar</a><div><h1>Divisão Campanha</h1><div class="total" id="total">Carregando dados reais…</div></div><span></span></div><div class="mapbox"><img id="map" src="assets/divisao-campanha-map.png" alt="Mapa 3D das regiões de Arapongas"><div class="map-fallback" id="mapFallback">Mapa 3D pronto para receber a imagem final.</div></div><section class="cards"><div class="r n"><i></i><span>NORTE</span><strong id="Norte">0</strong></div><div class="r o"><i></i><span>OESTE</span><strong id="Oeste">0</strong></div><div class="r l"><i></i><span>LESTE</span><strong id="Leste">0</strong></div><div class="r s"><i></i><span>SUL</span><strong id="Sul">0</strong></div><div class="r c"><i></i><span>CENTRO</span><strong id="Centro">0</strong></div></section><button class="peopleBtn" id="peopleBtn">👥 Pessoas <span id="peopleCount"></span></button><section class="panel" id="panel"><div class="filters"><input id="q" placeholder="Buscar nome, telefone ou colégio"><select id="rf"><option value="">Todas as regiões</option><option>Norte</option><option>Oeste</option><option>Leste</option><option>Sul</option><option>Centro</option></select></div><div class="list" id="list"></div></section><div class="status" id="status">Validando acesso…</div></main><script type="module">import{requireAuth,client}from'./auth-gate.js';const u=await requireAuth();const map=document.getElementById('map');map.onerror=()=>{map.style.display='none';document.getElementById('mapFallback').style.display='block'};if(u){const c=await client();const{data,error}=await c.from('campaign_division_responses').select('id,region,polling_place,name,phone,created_at').order('created_at',{ascending:false});const status=document.getElementById('status');if(error){status.textContent='Não foi possível carregar os dados.';console.error(error)}else{status.remove();const rows=data||[],counts={Norte:0,Oeste:0,Leste:0,Sul:0,Centro:0};rows.forEach(x=>{if(counts[x.region]!=null)counts[x.region]++});Object.keys(counts).forEach(k=>document.getElementById(k).textContent=counts[k]);document.getElementById('total').textContent=rows.length+' cadastros reais';document.getElementById('peopleCount').textContent='('+rows.length+')';const cls={Norte:'n',Oeste:'o',Leste:'l',Sul:'s',Centro:'c'},list=document.getElementById('list'),q=document.getElementById('q'),rf=document.getElementById('rf');function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function draw(){const z=q.value.toLowerCase().trim(),r=rf.value;const f=rows.filter(x=>(!r||x.region===r)&&(!z||(x.name+' '+x.phone+' '+x.polling_place).toLowerCase().includes(z)));list.innerHTML=f.length?f.map(x=>'<div class="person"><i class="dot '+cls[x.region]+'"></i><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.region)+' • '+esc(x.polling_place)+'</small></div><a class="wa" href="https://wa.me/55'+String(x.phone||'').replace(/\D/g,'')+'">WhatsApp<br>'+esc(x.phone)+'</a></div>').join(''):'<div class="empty">Nenhuma pessoa encontrada.</div>'}q.oninput=draw;rf.onchange=draw;draw();document.getElementById('peopleBtn').onclick=()=>document.getElementById('panel').classList.toggle('show')}};</script></body></html>
