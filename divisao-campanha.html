<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Divisão Campanha</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:18px}.wrap{max-width:1050px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:#93a4bd;text-decoration:none;font-weight:700}.top h1{font-size:22px;margin:0}.total{font-size:12px;color:#8ea0b9}.mapTitle{font-size:20px;margin:18px 0 9px}.mapbox{position:relative;margin:0 auto 12px;width:100%;height:min(62vh,620px);min-height:330px;overflow:hidden;border:1px solid #516079;border-radius:4px;background:#080d17;touch-action:none;user-select:none}.mapstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform;transition:transform .45s cubic-bezier(.22,.61,.36,1)}.mapbox img{display:block;max-width:92%;max-height:92%;width:auto;height:auto;object-fit:contain;pointer-events:none;-webkit-user-drag:none}.maptools{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;gap:6px}.maptools button{width:38px;height:38px;border:1px solid #33465f;border-radius:10px;background:rgba(10,20,35,.88);color:#fff;font-size:20px;font-weight:800}.maphint{position:absolute;left:10px;bottom:12px;z-index:3;padding:6px 9px;border-radius:8px;background:rgba(5,13,25,.72);color:#9eabc0;font-size:11px;pointer-events:none}.map-fallback{display:none;color:#64748b;text-align:center}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0}.r{appearance:none;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:16px;padding:13px 10px;background:#101a2a;border:1px solid #22324a;transition:transform .15s ease,border-color .15s ease,background .15s ease}.r:active{transform:scale(.97)}.r.active{border-color:#7187a8;background:#16243a;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}.r i{display:block;width:12px;height:12px;border-radius:50%;margin-bottom:8px}.r span{font-size:11px;color:#91a2b9}.r strong{display:block;font-size:23px;margin-top:3px}.n i,.dot.n{background:#29a7e8}.o i,.dot.o{background:#a62ad9}.l i,.dot.l{background:#32b85e}.s i,.dot.s{background:#ff7718}.c i,.dot.c{background:#ffd127}.peopleBtn{width:100%;border:1px solid #2b405e;background:#101b2d;color:#fff;border-radius:16px;padding:15px;font-size:16px;font-weight:800}.panel{display:none;margin-top:12px;background:#0e1726;border:1px solid #22324a;border-radius:18px;overflow:hidden}.panel.show{display:block}.filters{padding:12px;display:flex;gap:8px}.filters input,.filters select{min-width:0;flex:1;background:#091321;color:#fff;border:1px solid #293b56;border-radius:11px;padding:11px;font-size:14px}.list{max-height:48vh;overflow:auto}.person{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:12px;border-top:1px solid #1d2a3e}.dot{width:12px;height:12px;border-radius:50%}.person strong{display:block;font-size:14px}.person small{display:block;color:#8496ae;font-size:11px;margin-top:3px}.wa{color:#6ee7b7;text-decoration:none;font-size:12px;font-weight:800}.empty{padding:24px;text-align:center;color:#7f91aa}.status{text-align:center;color:#91a2b9;font-size:13px;padding:30px}@media(max-width:650px){body{padding:14px 11px}.top h1{font-size:19px}.mapTitle{font-size:17px}.mapbox{height:52vh;min-height:330px}.mapbox img{max-width:96%;max-height:94%}.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.r{padding:10px 5px;border-radius:12px}.r span{font-size:9px}.r strong{font-size:19px}.filters{flex-direction:column}.person{grid-template-columns:16px 1fr auto}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="javascript:history.back()">‹ Voltar</a><div><h1>Divisão Campanha</h1><div class="total" id="total">Carregando dados reais…</div></div><span></span></div><h2 class="mapTitle">Mapa 3D das regiões de Arapongas</h2><div class="mapbox" id="mapbox"><div class="mapstage" id="mapstage"><img id="map" src="assets/C4C54705-D195-473C-9804-6FA319D84614.png?v=4" alt="Mapa 3D das regiões de Arapongas"><div class="map-fallback" id="mapFallback">Não foi possível carregar o mapa.</div></div><div class="maphint" id="maphint">Toque em uma região abaixo ou use dois dedos para ampliar</div><div class="maptools"><button type="button" id="zoomOut" aria-label="Diminuir">−</button><button type="button" id="resetZoom" aria-label="Redefinir">↺</button><button type="button" id="zoomIn" aria-label="Ampliar">+</button></div></div><section class="cards"><button type="button" class="r n" data-region="Norte"><i></i><span>NORTE</span><strong id="Norte">0</strong></button><button type="button" class="r o" data-region="Oeste"><i></i><span>OESTE</span><strong id="Oeste">0</strong></button><button type="button" class="r l" data-region="Leste"><i></i><span>LESTE</span><strong id="Leste">0</strong></button><button type="button" class="r s" data-region="Sul"><i></i><span>SUL</span><strong id="Sul">0</strong></button><button type="button" class="r c" data-region="Centro"><i></i><span>CENTRO</span><strong id="Centro">0</strong></button></section><button class="peopleBtn" id="peopleBtn">👥 Pessoas <span id="peopleCount"></span></button><section class="panel" id="panel"><div class="filters"><input id="q" placeholder="Buscar nome, telefone ou colégio"><select id="rf"><option value="">Todas as regiões</option><option>Norte</option><option>Oeste</option><option>Leste</option><option>Sul</option><option>Centro</option></select></div><div class="list" id="list"></div></section><div class="status" id="status">Validando acesso…</div></main><script type="module">import{requireAuth,client}from'./auth-gate.js';const u=await requireAuth();const map=document.getElementById('map'),box=document.getElementById('mapbox'),stage=document.getElementById('mapstage'),hint=document.getElementById('maphint');map.onerror=()=>{map.style.display='none';document.getElementById('mapFallback').style.display='block'};let scale=1,x=0,y=0,lastX=0,lastY=0,startDist=0,startScale=1,drag=false;function apply(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function clearActive(){document.querySelectorAll('.r').forEach(b=>b.classList.remove('active'))}function setScale(v){scale=Math.max(1,Math.min(5,v));if(scale===1){x=0;y=0;clearActive()}apply()}const focus={Norte:{scale:1.55,x:-.02,y:.16},Oeste:{scale:1.70,x:.06,y:.03},Leste:{scale:1.78,x:.03,y:.01},Sul:{scale:1.62,x:-.03,y:-.27},Centro:{scale:2.05,x:.01,y:-.28}};function focusRegion(region){const f=focus[region];if(!f)return;const w=box.clientWidth,h=box.clientHeight;scale=f.scale;x=f.x*w;y=f.y*h;stage.style.transition='transform .45s cubic-bezier(.22,.61,.36,1)';apply();clearActive();const b=document.querySelector(`.r[data-region="${region}"]`);if(b)b.classList.add('active');hint.textContent='Região '+region+' em destaque • arraste para explorar';box.scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('.r[data-region]').forEach(b=>b.addEventListener('click',()=>focusRegion(b.dataset.region)));document.getElementById('zoomIn').onclick=()=>setScale(scale+.4);document.getElementById('zoomOut').onclick=()=>setScale(scale-.4);document.getElementById('resetZoom').onclick=()=>{scale=1;x=y=0;clearActive();hint.textContent='Toque em uma região abaixo ou use dois dedos para ampliar';apply()};box.addEventListener('wheel',e=>{e.preventDefault();setScale(scale+(e.deltaY<0?.25:-.25))},{passive:false});function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}box.addEventListener('touchstart',e=>{stage.style.transition='none';if(e.touches.length===2){startDist=dist(e.touches);startScale=scale}else if(e.touches.length===1&&scale>1){drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}},{passive:false});box.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();setScale(startScale*dist(e.touches)/startDist)}else if(e.touches.length===1&&drag&&scale>1){e.preventDefault();const nx=e.touches[0].clientX,ny=e.touches[0].clientY;x+=nx-lastX;y+=ny-lastY;lastX=nx;lastY=ny;apply()}},{passive:false});box.addEventListener('touchend',()=>{drag=false;stage.style.transition='transform .45s cubic-bezier(.22,.61,.36,1)'});box.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&scale>1){stage.style.transition='none';drag=true;lastX=e.clientX;lastY=e.clientY;box.setPointerCapture(e.pointerId)}});box.addEventListener('pointermove',e=>{if(drag&&e.pointerType==='mouse'){x+=e.clientX-lastX;y+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply()}});box.addEventListener('pointerup',()=>{drag=false;stage.style.transition='transform .45s cubic-bezier(.22,.61,.36,1)'});if(u){const c=await client();const{data,error}=await c.from('campaign_division_responses').select('id,region,polling_place,name,phone,created_at').order('created_at',{ascending:false});const status=document.getElementById('status');if(error){status.textContent='Não foi possível carregar os dados.';console.error(error)}else{status.remove();const rows=data||[],counts={Norte:0,Oeste:0,Leste:0,Sul:0,Centro:0};rows.forEach(a=>{if(counts[a.region]!=null)counts[a.region]++});Object.keys(counts).forEach(k=>document.getElementById(k).textContent=counts[k]);document.getElementById('total').textContent=rows.length+' cadastros reais';document.getElementById('peopleCount').textContent='('+rows.length+')';const cls={Norte:'n',Oeste:'o',Leste:'l',Sul:'s',Centro:'c'},list=document.getElementById('list'),q=document.getElementById('q'),rf=document.getElementById('rf');function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function draw(){const z=q.value.toLowerCase().trim(),r=rf.value;const f=rows.filter(a=>(!r||a.region===r)&&(!z||(a.name+' '+a.phone+' '+a.polling_place).toLowerCase().includes(z)));list.innerHTML=f.length?f.map(a=>'<div class="person"><i class="dot '+cls[a.region]+'"></i><div><strong>'+esc(a.name)+'</strong><small>'+esc(a.region)+' • '+esc(a.polling_place)+'</small></div><a class="wa" href="https://wa.me/55'+String(a.phone||'').replace(/\D/g,'')+'">WhatsApp<br>'+esc(a.phone)+'</a></div>').join(''):'<div class="empty">Nenhuma pessoa encontrada.</div>'}q.oninput=draw;rf.onchange=draw;draw();document.getElementById('peopleBtn').onclick=()=>document.getElementById('panel').classList.toggle('show')}};</script></body></html>
