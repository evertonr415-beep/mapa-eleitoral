<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Redefinir senha - VotoForte Arapongas</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d17;color:#e5edf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:linear-gradient(180deg,#101a2b,#0c1422);border:1px solid #22324a;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{width:54px;height:54px;border-radius:14px;background:#18253a;display:grid;place-items:center;font-weight:800;color:#60a5fa;border:1px solid #2b3e5d}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#8fa1ba;font-size:13px}.copy{font-size:13px;line-height:1.5;color:#9fb0c7;margin:0 0 10px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:700;color:#9fb0c7;margin-bottom:6px}.input-wrap{position:relative}.field input{width:100%;height:48px;border-radius:12px;border:1px solid #2b3b54;background:#0a1220;color:#fff;padding:0 52px 0 14px;font-size:16px;outline:none}.field input:focus{border-color:#3b82f6}.eye{position:absolute;right:4px;top:4px;width:42px;height:40px;border:0;background:transparent;color:#8fa1ba;border-radius:10px;font-size:20px}.btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:800;font-size:15px;margin-top:18px}.btn:disabled{opacity:.6}.status{min-height:20px;margin-top:12px;font-size:12px;color:#fda4af}.status.ok{color:#6ee7b7}.foot{margin-top:18px;text-align:center;color:#64748b;font-size:11px}.hidden{display:none}.loader{text-align:center;color:#94a3b8;font-size:13px;padding:14px 0}</style></head><body><main class="card"><div class="brand"><div class="logo">VF</div><div><h1>VotoForte Arapongas</h1><p>Redefinição de senha</p></div></div><div id="loader" class="loader">Validando seu link de recuperação...</div><section id="formBox" class="hidden"><p class="copy">Crie uma nova senha para sua conta. Por segurança, use pelo menos 8 caracteres.</p><form id="form"><div class="field"><label for="newPass">Nova senha</label><div class="input-wrap"><input id="newPass" type="password" autocomplete="new-password" minlength="8" required><button class="eye" type="button" data-target="newPass" aria-label="Mostrar senha">◉</button></div></div><div class="field"><label for="confirmPass">Confirmar nova senha</label><div class="input-wrap"><input id="confirmPass" type="password" autocomplete="new-password" minlength="8" required><button class="eye" type="button" data-target="confirmPass" aria-label="Mostrar senha">◉</button></div></div><button id="submit" class="btn" type="submit">Salvar nova senha</button><div id="status" class="status"></div></form></section><div class="foot">VotoForte Arapongas · acesso protegido</div></main><script type="module">import{updatePassword,signOut}from'./auth-gate.js';const loader=document.getElementById('loader'),box=document.getElementById('formBox'),form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit');for(const b of document.querySelectorAll('.eye'))b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.target),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'◎':'◉';b.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha')});async function ready(){const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('error')){loader.textContent='Este link é inválido ou expirou. Solicite uma nova recuperação de senha.';return}await new Promise(r=>setTimeout(r,500));loader.classList.add('hidden');box.classList.remove('hidden')}ready();form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const p=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value;if(p!==c){status.textContent='As senhas não coincidem.';return}submit.disabled=true;submit.textContent='Salvando...';try{await updatePassword(p);status.textContent='Senha alterada com sucesso. Você será direcionado para o login.';status.className='status ok';setTimeout(()=>signOut(),1200)}catch(err){status.textContent=err?.message||'Não foi possível alterar a senha.';submit.disabled=false;submit.textContent='Salvar nova senha'}});</script></body></html>
