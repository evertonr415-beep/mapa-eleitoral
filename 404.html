<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d17">
  <title>VotoForte Arapongas</title>
  <style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080d17;color:#e5edf8}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#101a2b;border:1px solid #22324a;border-radius:20px;padding:25px;text-align:center}.card h1{font-size:20px;margin:0 0 8px}.card p{font-size:13px;line-height:1.5;color:#9fb0c7}.btn{display:inline-flex;margin-top:12px;padding:12px 17px;border-radius:11px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;font-size:13px}</style>
</head>
<body>
  <main class="card"><h1>Página não encontrada</h1><p>O endereço acessado não existe ou foi alterado.</p><a class="btn" href="/">Voltar ao início</a></main>
  <script>
  (function(){
    var path=decodeURIComponent(location.pathname||'').toLowerCase();
    var ref=(document.referrer||'').toLowerCase();
    var looksLikeVote=/enquete|votacao|vota[cç][aã]o|voto|resultado|finaliz|obrigado|sucesso/.test(path);
    var cameFromPoll=/sistemavotoforte\.com\.br\/enquete\//.test(ref);
    if(looksLikeVote||cameFromPoll){
      location.replace('/resultado/'+location.search+location.hash);
    }
  })();
  </script>
</body>
</html>
