<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d17"><title>VotoForte Arapongas</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#vf-desktop-mirror{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:#080d17}#vf-mobile-frame{display:block;width:900px;height:100vh;border:0;background:#080d17;transform-origin:top center;visibility:hidden}#vf-mobile-frame.ready{visibility:visible}#vf-desktop-loading{position:fixed;inset:0;display:grid;place-items:center;background:#080d17;z-index:2;text-align:center}#vf-desktop-loading strong{display:block;color:#e5edf8;font-size:15px}#vf-desktop-loading span{display:block;margin-top:5px;color:#64748b;font-size:11px}#vf-desktop-loading.hide{display:none}@media(max-width:900px){#vf-mobile-frame{width:100vw!important;height:100vh!important;transform:none!important}}</style></head><body><div id="vf-desktop-mirror"><iframe id="vf-mobile-frame" title="VotoForte Arapongas" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe></div><div id="vf-desktop-loading"><div><strong>Carregando VotoForte...</strong><span>Adaptando o painel mobile para sua tela.</span></div></div><script type="module">import{requireAuth,currentUser}from'./auth-gate.js';const user=await requireAuth();if(user){const frame=document.getElementById('vf-mobile-frame'),loading=document.getElementById('vf-desktop-loading');function fit(){const base=900,room=Math.max(900,window.innerWidth-24),scale=Math.min(1.4,Math.max(1,room/base));frame.style.width=base+'px';frame.style.height=(window.innerHeight/scale)+'px';frame.style.transform='scale('+scale+')';}fit();addEventListener('resize',fit,{passive:true});frame.addEventListener('load',()=>{try{const p=frame.contentWindow.location.pathname,s=frame.contentWindow.location.search;if((p==='/'||p==='/index.html')&&s.includes('login=1')){location.replace('./?login=1');return}if(p.endsWith('/force-password.html')){location.replace('./force-password.html');return}}catch(_){}frame.classList.add('ready');loading.classList.add('hide');});frame.src=location.origin+'/mobile-production.html?desktopMirror=1&v=31.1';setInterval(async()=>{if(document.hidden)return;const ok=await currentUser();if(!ok)location.replace('./?login=1')},60000);}</script></body></html>
