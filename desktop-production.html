<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d17"><title>Mapa Eleitoral</title><style>html,body{margin:0;height:100%;background:#080d17;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}</style></head><body>Verificando acesso...<script type="module">import{requireAuth,currentUser,signOut}from'./auth-gate.js';const u=await requireAuth();if(u){const secureLogout=async()=>{if(!confirm('Deseja realmente sair da sua conta?'))return;try{await signOut()}catch(_){location.replace('https://www.votofortearapongas.com.br/?login=1')}};try{Object.defineProperty(window,'handleLogout',{configurable:false,get(){return secureLogout},set(){}})}catch(_){window.handleLogout=secureLogout}setInterval(async()=>{if(document.hidden)return;const ok=await currentUser();if(!ok)location.replace('https://www.votofortearapongas.com.br/?login=1')},60000);try{const selected='https://cdn.jsdelivr.net/gh/evertonr415-beep/mapa-eleitoral@062c8936269ce6592e2085f8463e15b6765a3e0a/index.html';const r=await fetch(selected,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let h=await r.text();h=h.replace(/<meta name="robots"[^>]*>/i,'');h=h.replace(/<style>#vf-preview-badge\{[\s\S]*?<\/style>/i,'');h=h.replace(/<div id="vf-preview-badge">[\s\S]*?<\/div>/i,'');h=h.replace('</body>','<script src="https://www.votofortearapongas.com.br/managed-signup-fix.js"></script></body>');document.open();document.write(h);document.close()}catch(e){console.error('Desktop load failed:',e);document.body.textContent='Não foi possível carregar o sistema.'}}</script></body></html>
