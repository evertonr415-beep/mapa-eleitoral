<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d17">
  <title>Mapa Eleitoral - Preview Mobile</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#080d17;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px;text-align:center}.spinner{width:34px;height:34px;border:3px solid rgba(148,163,184,.2);border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}.loader strong{font-size:15px}.loader small{color:#94a3b8;max-width:300px}.loader button{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:750}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="loader">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Carregando a versão mobile...</strong>
    <small>Preview pública isolada da versão oficial.</small>
  </main>
  <script>
    (async function(){
      var stable='d7a280e173dd1f4431d1e910fd9b6672dab37e33';
      var mobile='8a272535f256ded534259c62031d9fd45f599282';
      var cdn='https://cdn.jsdelivr.net/gh/evertonr415-beep/mapa-eleitoral@';
      try{
        var response=await fetch(cdn+stable+'/index.html',{cache:'no-store'});
        if(!response.ok)throw new Error('Falha ao carregar a base: HTTP '+response.status);
        var html=await response.text();
        html=html.replace(/<base\b[^>]*>/gi,'');
        var base='<base href="'+cdn+stable+'/">';
        var forceCss='<style id="vf-force-compact-css">'+
          '@media(max-width:900px){'+
          'body.vf-force-list #view-table-colegios{padding:6px 7px calc(var(--vf-bottom-nav) + var(--vf-safe-bottom) + 12px)!important;}'+
          'body.vf-force-list #view-table-colegios>.vf-mobile-page-head,body.vf-force-list #view-table-colegios>div:first-child{display:none!important;}'+
          'body.vf-force-list .vf-force-original-wrap{display:none!important;}'+
          '.vf-force-college-list{display:none;width:100%;overflow:hidden;border:1px solid rgba(148,163,184,.12);border-radius:11px;background:#0f1929;}'+
          'body.vf-force-list .vf-force-college-list{display:block;}'+
          '.vf-force-summary{height:39px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px;border-bottom:1px solid rgba(148,163,184,.12);background:#142137;}'+
          '.vf-force-summary-copy{min-width:0;flex:1}.vf-force-summary-copy strong{display:block;overflow:hidden;color:#f8fafc;font-size:11px;line-height:1;white-space:nowrap;text-overflow:ellipsis}.vf-force-summary-copy small{display:block;margin-top:3px;color:#7588a3;font-size:7.5px;line-height:1;}'+
          '.vf-force-summary-total{flex:0 0 auto;color:#60a5fa;font-size:10px;font-weight:850;}'+
          '.vf-force-row{min-height:42px;display:grid;grid-template-columns:22px minmax(0,1fr) 47px 59px;gap:5px;align-items:center;padding:4px 5px;border-bottom:1px solid rgba(148,163,184,.085);background:#0f1929;}'+
          '.vf-force-row:last-child{border-bottom:0}.vf-force-num{display:grid;width:21px;height:21px;place-items:center;border-radius:6px;background:#19283e;color:#8294ad;font-size:7px;font-weight:850;}'+
          '.vf-force-name{min-width:0;overflow:hidden;color:#edf3fb;font-size:9px;font-weight:770;line-height:1.08;white-space:nowrap;text-overflow:ellipsis;}'+
          '.vf-force-votes{text-align:right;white-space:nowrap}.vf-force-votes strong{display:block;color:#60a5fa;font-size:9.4px;line-height:1}.vf-force-votes small{display:block;margin-top:3px;color:#7487a1;font-size:7px;line-height:1;}'+
          '.vf-force-actions{display:grid;grid-template-columns:28px 28px;gap:3px}.vf-force-btn{width:28px;height:28px;display:grid;place-items:center;padding:0;border:1px solid rgba(148,163,184,.16);border-radius:7px;background:#19273d;color:#91bdf4;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.vf-force-btn.add{border-color:rgba(52,211,153,.26);background:rgba(16,185,129,.10);color:#4ade80}.vf-force-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}'+
          '.vf-force-detail-overlay{position:fixed;inset:0;z-index:4980;border:0;background:rgba(2,6,23,.70);opacity:0;pointer-events:none;transition:opacity .16s ease}.vf-force-detail-sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--vf-bottom-nav) + var(--vf-safe-bottom) + 8px);z-index:4990;padding:12px;border:1px solid rgba(96,165,250,.20);border-radius:15px;background:#111d30;box-shadow:0 22px 60px rgba(0,0,0,.55);transform:translateY(calc(100% + 100px));transition:transform .18s ease}body.vf-force-detail-open .vf-force-detail-overlay{opacity:1;pointer-events:auto}body.vf-force-detail-open .vf-force-detail-sheet{transform:translateY(0)}'+
          '.vf-force-sheet-head{display:grid;grid-template-columns:minmax(0,1fr) 31px;gap:8px;align-items:start;padding-bottom:9px;border-bottom:1px solid rgba(148,163,184,.10)}.vf-force-sheet-head span{display:block;color:#71839c;font-size:7px;font-weight:850;text-transform:uppercase}.vf-force-sheet-head strong{display:block;margin-top:3px;color:#f8fafc;font-size:12px;line-height:1.18}.vf-force-close{width:31px;height:31px;border:1px solid rgba(148,163,184,.16);border-radius:8px;background:#18263c;color:#9aacbf;font-size:18px}'+
          '.vf-force-sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}.vf-force-sheet-grid div{min-width:0;padding:7px;border-radius:8px;background:#17253a}.vf-force-sheet-grid span{display:block;color:#6e819b;font-size:6.5px;font-weight:850;text-transform:uppercase}.vf-force-sheet-grid strong{display:block;margin-top:3px;overflow:hidden;color:#dbe6f2;font-size:9px;white-space:nowrap;text-overflow:ellipsis}.vf-force-sheet-grid .blue strong{color:#60a5fa}.vf-force-sheet-grid .green strong{color:#34d399}.vf-force-sheet-address{margin-top:7px;padding:7px 8px;border-radius:8px;background:rgba(30,41,59,.48);color:#96a6ba;font-size:8.5px;line-height:1.25}.vf-force-sheet-add{width:100%;min-height:38px;margin-top:8px;border:1px solid rgba(52,211,153,.28);border-radius:9px;background:rgba(16,185,129,.12);color:#4ade80;font-size:10px;font-weight:800;}'+
          '}'+
          '</style>';
        var mobileHead='<meta name="theme-color" content="#080d17">'+
          '<style>#vf-preview-badge{display:none!important}</style>'+
          '<link rel="stylesheet" href="'+cdn+mobile+'/mobile-shell.css">'+
          '<link rel="stylesheet" href="'+cdn+mobile+'/mobile-views.css">'+
          '<link rel="stylesheet" href="'+cdn+mobile+'/mobile-polish.css">'+
          '<link rel="stylesheet" href="'+cdn+mobile+'/mobile-layer-fix.css">'+forceCss;

        var forceScript='<scr'+'ipt>(function(){'+
          'if(window.__vfForceCompactInstalled)return;window.__vfForceCompactInstalled=true;'+
          'var mm=window.matchMedia("(max-width:900px)");var timer=null;var rowRefs=[];'+
          'function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}'+
          'function candidateName(sel){if(!sel||sel.selectedIndex<0)return "Candidato";var t=(sel.options[sel.selectedIndex].textContent||"").replace(/^[^A-Za-zÀ-ÿ0-9]+/,"").trim();var i=t.indexOf(" - ");if(i>0)t=t.slice(0,i);return t;}'+
          'function ensureUi(){var view=document.getElementById("view-table-colegios");if(!view)return null;var table=view.querySelector(".colegios-table");if(table&&table.parentElement)table.parentElement.classList.add("vf-force-original-wrap");var list=view.querySelector(".vf-force-college-list");if(!list){list=document.createElement("section");list.className="vf-force-college-list";if(table&&table.parentElement)table.parentElement.insertAdjacentElement("beforebegin",list);else view.appendChild(list);}if(!document.querySelector(".vf-force-detail-overlay")){var ov=document.createElement("button");ov.type="button";ov.className="vf-force-detail-overlay";ov.setAttribute("aria-label","Fechar detalhes");var sh=document.createElement("section");sh.className="vf-force-detail-sheet";document.body.append(ov,sh);ov.addEventListener("click",closeSheet);}return list;}'+
          'function closeSheet(){document.body.classList.remove("vf-force-detail-open");}'+
          'function openSheet(idx){var r=rowRefs[idx];if(!r)return;var c=r.cells;var sh=document.querySelector(".vf-force-detail-sheet");if(!sh)return;var name=c[1]?c[1].textContent.trim():"Colégio";var address=c[2]?c[2].textContent.trim():"";var sections=c[3]?c[3].textContent.trim():"-";var votes=c[4]?c[4].textContent.trim():"-";var pct=c[5]?c[5].textContent.trim():"-";var total=c[6]?c[6].textContent.trim():"-";var leaders=c[7]?c[7].textContent.trim():"-";sh.innerHTML="<div class=\"vf-force-sheet-head\"><div><span>Colégio eleitoral</span><strong>"+esc(name)+"</strong></div><button type=\"button\" class=\"vf-force-close\">×</button></div><div class=\"vf-force-sheet-grid\"><div class=\"blue\"><span>Votos</span><strong>"+esc(votes)+"</strong></div><div><span>Desempenho</span><strong>"+esc(pct)+"</strong></div><div><span>Seções</span><strong>"+esc(sections)+"</strong></div><div><span>Total</span><strong>"+esc(total)+"</strong></div><div class=\"green\"><span>Lideranças</span><strong>"+esc(leaders)+"</strong></div><div><span>Número</span><strong>"+(idx+1)+"</strong></div></div><div class=\"vf-force-sheet-address\">"+esc(address)+"</div><button type=\"button\" class=\"vf-force-sheet-add\">+ Adicionar liderança neste colégio</button>";sh.querySelector(".vf-force-close").addEventListener("click",closeSheet);sh.querySelector(".vf-force-sheet-add").addEventListener("click",function(){var original=c[8]&&c[8].querySelector("button");closeSheet();if(original)original.click();});document.body.classList.add("vf-force-detail-open");}'+
          'function build(){timer=null;if(!mm.matches)return;var sel=document.getElementById("cand-select");var body=document.getElementById("table-colegios-body");if(!sel||!body)return;if(sel.value==="ALL"){document.body.classList.remove("vf-force-list");var old=document.querySelector(".vf-force-college-list");if(old)old.innerHTML="";return;}var rows=Array.from(body.querySelectorAll("tr"));if(!rows.length)return;var list=ensureUi();if(!list)return;rowRefs=rows;var totalVotes=0;var eye="<svg viewBox=\"0 0 24 24\"><path d=\"M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z\"/><circle cx=\"12\" cy=\"12\" r=\"2.6\"/></svg>";var plus="<svg viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/></svg>";var items=rows.map(function(r,i){var c=r.cells;var name=c[1]?c[1].textContent.trim():"Colégio";var votes=c[4]?c[4].textContent.trim():"0 v";var pct=c[5]?c[5].textContent.trim():"0%";var n=parseInt(votes.replace(/\D/g,""),10)||0;totalVotes+=n;return "<div class=\"vf-force-row\"><span class=\"vf-force-num\">"+String(i+1).padStart(2,"0")+"</span><span class=\"vf-force-name\">"+esc(name)+"</span><span class=\"vf-force-votes\"><strong>"+esc(votes)+"</strong><small>"+esc(pct)+"</small></span><span class=\"vf-force-actions\"><button type=\"button\" class=\"vf-force-btn detail\" data-vf-d=\""+i+"\" aria-label=\"Ver detalhes\">"+eye+"</button><button type=\"button\" class=\"vf-force-btn add\" data-vf-a=\""+i+"\" aria-label=\"Adicionar liderança\">"+plus+"</button></span></div>";}).join("");list.innerHTML="<div class=\"vf-force-summary\"><div class=\"vf-force-summary-copy\"><strong>"+esc(candidateName(sel))+"</strong><small>"+rows.length+" colégios • lista compacta</small></div><div class=\"vf-force-summary-total\">"+totalVotes.toLocaleString("pt-BR")+" votos</div></div>"+items;list.querySelectorAll("[data-vf-d]").forEach(function(b){b.addEventListener("click",function(){openSheet(Number(b.getAttribute("data-vf-d")));});});list.querySelectorAll("[data-vf-a]").forEach(function(b){b.addEventListener("click",function(){var idx=Number(b.getAttribute("data-vf-a"));var r=rowRefs[idx];var original=r&&r.cells[8]&&r.cells[8].querySelector("button");if(original)original.click();});});document.body.classList.add("vf-force-list");document.body.classList.remove("vf-drawer-open");}'+
          'function schedule(){clearTimeout(timer);timer=setTimeout(build,80);}'+
          'function install(){var sel=document.getElementById("cand-select");var body=document.getElementById("table-colegios-body");if(sel&&!sel.dataset.vfForceBound){sel.dataset.vfForceBound="1";sel.addEventListener("change",function(){document.body.classList.remove("vf-drawer-open");setTimeout(schedule,120);});}if(body&&!body.dataset.vfForceObserved){body.dataset.vfForceObserved="1";new MutationObserver(schedule).observe(body,{childList:true,subtree:true});}schedule();setTimeout(schedule,400);setTimeout(schedule,1200);}'+
          'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install,{once:true});else install();window.addEventListener("resize",schedule);'+
          '})();</scr'+'ipt>';

        var mobileScripts='<scr'+'ipt src="'+cdn+mobile+'/mobile-ui.js"></scr'+'ipt>'+
          '<scr'+'ipt src="'+cdn+mobile+'/mobile-polish.js"></scr'+'ipt>'+forceScript;
        html=html.replace(/<head([^>]*)>/i,'<head$1>'+base);
        html=html.replace('</head>',mobileHead+'</head>');
        html=html.replace('</body>',mobileScripts+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<main class="loader"><strong>Não foi possível abrir a preview.</strong><small>'+String(error&&error.message?error.message:error)+'</small><button onclick="location.reload()">Tentar novamente</button></main>';
      }
    }());
  </script>
</body>
</html>
