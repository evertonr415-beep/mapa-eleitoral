<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Obrigado</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#052b62}body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.thanks{position:fixed;inset:0;background:#052b62;display:flex;align-items:center;justify-content:center;overflow:hidden}.thanks img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center}.tagline{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;color:#f4c52d;font-family:Arial,"Helvetica Neue",sans-serif;font-size:clamp(11px,3.2vw,18px);font-weight:900;font-style:italic;letter-spacing:.25px;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}.tagline:before,.tagline:after{content:"";display:block;height:2px;flex:1;max-width:52px;background:#f4c52d}.success{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:2;padding:14px 16px;border-radius:14px;text-align:center;color:#fff;font-size:15px;font-weight:700;background:rgba(8,74,76,.88);border:1px solid rgba(60,210,154,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}</style></head><body><div class="thanks"><img src="457D8781-A9CB-453E-A086-8126EA8D32BD.png?v=2" alt="Obrigado por sua participação"></div><div class="tagline">A DUPLA QUE TRANSFORMOU ARAPONGAS</div><div class="success" id="success">Resposta enviada com sucesso.</div><audio id="jingle" preload="auto" autoplay playsinline src="Pedro%20e%20Sergio%20Medley%202.mp3?v=1"></audio><script>(function(){var s=document.getElementById('success'),a=document.getElementById('jingle');window.setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s)},1300);function stop(){if(!a)return;a.pause();try{a.currentTime=0}catch(e){}}window.setTimeout(stop,40000);if(a){a.volume=1;var p=a.play();if(p&&p.catch)p.catch(function(){document.addEventListener('touchstart',function start(){a.play().catch(function(){});document.removeEventListener('touchstart',start)}, {once:true})});a.addEventListener('timeupdate',function(){if(a.currentTime>=40)stop()})}})();</script></body></html>
