<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divisão de Equipe Sérgio e Pedro</title><link rel="preload" as="image" href="obrigado/thank-you.jpg"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{background:#102744;color:#fff}.hero{margin:0;padding:0;background:#16365e;overflow:hidden}.hero img{display:block;width:100%;height:auto;object-fit:contain}main{padding:20px 18px 44px}.card{max-width:720px;margin:auto;border-radius:24px;padding:24px 18px 20px;box-shadow:0 16px 44px rgba(0,0,0,.22);background:linear-gradient(145deg,#173a69,#0e2c55);border:1px solid rgba(255,255,255,.12)}.title{font-size:25px;font-weight:800;margin:0 0 6px}.sub{margin:0 0 20px;font-size:14px;color:#c9d7e9}.regions{display:flex;flex-direction:column;gap:12px;margin-bottom:25px}.region{position:relative;width:100%;min-height:74px;border:1.5px solid rgba(92,174,255,.38);border-radius:19px;padding:14px 52px 14px 15px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:18px;cursor:pointer;user-select:none;transition:.18s;background:rgba(14,69,126,.38)}.region .dot{width:32px;height:32px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 7px rgba(255,255,255,.12)}.region:after{content:"✓";position:absolute;right:17px;top:50%;transform:translateY(-50%) scale(.75);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;background:#198cff;opacity:0;transition:.18s}.region.selected{border-color:#65b4ff;background:linear-gradient(135deg,rgba(25,117,204,.72),rgba(11,68,127,.72));box-shadow:0 0 0 3px rgba(56,156,255,.23),0 8px 22px rgba(0,92,190,.25);transform:translateY(-1px)}.region.selected:after{opacity:1;transform:translateY(-50%) scale(1)}.region.selected .dot{box-shadow:0 0 0 7px rgba(255,255,255,.2),0 0 18px rgba(77,173,255,.5)}.norte .dot{background:#29a7e8}.oeste .dot{background:#a62ad9}.leste .dot{background:#32b85e}.sul .dot{background:#ff7718}.centro .dot{background:#ffd127}.field label,.participant-fields label{display:block;font-size:14px;font-weight:750;margin:0 0 8px}.combo{position:relative}.combo-input-wrap{display:flex;border-radius:14px;overflow:hidden;background:#0b2447;border:1px solid rgba(255,255,255,.15)}.combo input{width:100%;border:0;outline:0;padding:14px 13px;font-size:15px;background:transparent;color:inherit}.combo-arrow{width:48px;border:0;background:transparent;color:inherit}.combo-arrow svg{width:21px;fill:none;stroke:currentColor;stroke-width:2}.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:270px;overflow:auto;border-radius:14px;display:none;background:#0d2a51;border:1px solid rgba(255,255,255,.14)}.combo-list.open{display:block}.combo-option,.combo-empty{padding:12px 13px;font-size:13px;line-height:1.25;border-bottom:1px solid rgba(128,145,165,.18)}.combo-option{cursor:pointer}.participant-fields{margin-top:20px}.participant-fields input{display:block;width:100%;border-radius:14px;outline:0;padding:14px 13px;font-size:15px;color:inherit;margin:0 0 15px;background:#0b2447;border:1px solid rgba(255,255,255,.15)}.privacy-note{font-size:12px;line-height:1.4;margin:0 0 20px;opacity:.72}.submit{width:100%;border:0;border-radius:15px;padding:15px 18px;font-size:16px;font-weight:850;background:linear-gradient(180deg,#2688ff,#0866dc);color:#fff;cursor:pointer}.submit:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:12px 13px;border-radius:12px;font-size:13px}.msg.err{display:block;background:rgba(235,74,74,.14);border:1px solid rgba(235,74,74,.35)}@media(max-width:480px){main{padding:16px 12px 34px}.card{padding:20px 14px}.title{font-size:22px}.region{min-height:70px}}</style></head><body><header class="hero"><img src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/083997f2-b3c5-4583-970f-f47d2240f54e.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODhiZTlhNDllMGQzNWQ2MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTcwMzExM30.I8FyTh7bExTRdRS-cBl-mMAxygPAM7dSgi6-8PQZ-vU" alt="Sérgio e Pedro"></header><main><form id="teamForm" class="card"><h2 class="title">Qual é a sua região?</h2><p class="sub">Selecione apenas uma opção.</p><div class="regions"><div class="region norte" data-value="Norte"><span class="dot"></span>Norte</div><div class="region oeste" data-value="Oeste"><span class="dot"></span>Oeste</div><div class="region leste" data-value="Leste"><span class="dot"></span>Leste</div><div class="region sul" data-value="Sul"><span class="dot"></span>Sul</div><div class="region centro" data-value="Centro"><span class="dot"></span>Centro</div></div><input type="hidden" id="region" required><div class="field"><label for="collegeSearch">Qual é o seu colégio eleitoral?</label><div class="combo" id="collegeCombo"><div class="combo-input-wrap"><input required id="collegeSearch" type="text" placeholder="Digite para buscar seu colégio" autocomplete="off"><button class="combo-arrow" id="collegeArrow" type="button"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div><div class="combo-list" id="collegeList"></div></div></div><div class="participant-fields"><label for="participantName">Nome completo</label><input id="participantName" type="text" placeholder="Digite seu nome completo" required><label for="participantPhone">Telefone / WhatsApp</label><input id="participantPhone" type="tel" inputmode="numeric" placeholder="(43) 99999-9999" maxlength="15" required><p class="privacy-note">Seus dados serão utilizados para identificação e organização desta pesquisa.</p></div><button class="submit" id="submitBtn">Enviar resposta</button><div class="msg" id="msg"></div></form></main><script>const colleges=["ESCOLA MUNICIPAL PROFESSORA ANTONICA GIROLDO FRANCIOSI","COLÉGIO ESTADUAL ANTÔNIO RACANELLO SAMPAIO","COLÉGIO ESTADUAL ANTÔNIO GARCEZ NOVAES","ESCOLA MUNICIPAL HELOIZA MARIA VICTORIA PAUMYRA CUROTTO GIANCRISTOFARO","COLÉGIO ESTADUAL PROFESSORA NADIR MENDES MONTANHA","CENTRO PASTORAL DA IGREJA SANTO ANTONIO DE PADUA","ESCOLA MUNICIPAL PRESIDENTE GETÚLIO VARGAS","CLUBE COMERCIAL DE ARAPONGAS","COLÉGIO ESTADUAL FRANCISCO FERREIRA BASTOS","ESCOLA ESTADUAL WALFREDO SILVEIRA CORREIA","ESCOLA MUNICIPAL PROFESSORA ALZIRA HORVATICH","ESCOLA MUNICIPAL JOSE BERNARDO DOS SANTOS","ESCOLA MUNICIPAL PROFESSORA ALEYDAH C.S. OLIVEIRA","ESCOLA MUNICIPAL PROFESSOR JOSE DE CARVALHO","ESCOLA MUNICIPAL DESEMBARGADOR CLOTARIO PORTUGAL","COLÉGIO ESTADUAL IVANILDE DE NORONHA","COLÉGIO ESTADUAL EMILIO DE MENEZES","ESCOLA MUNICIPAL PAPA JOÃO PAULO II","COLÉGIO ESTADUAL UNIDADE POLO","COLÉGIO ESTADUAL MARQUES DE CARAVELAS","ESCOLA MUNICIPAL DE ARICANDUVA","ESCOLA MUNICIPAL PADRE GERMANO MAYER","ESCOLA MUNICIPAL DOUTORA MARIA HERCÍLIA HORÁCIO STAWINSKI","ESCOLA MUNICIPAL PROFESSORA DIOMAR DE OLIVEIRA PEGOER","COLÉGIO ESTADUAL IRONDI MANTOVANI PUGLIESE","ESCOLA MUNICIPAL ENZO BATISTA DALEFFE PEREIRA","COLÉGIO BOM JESUS MÃE DO DIVINO AMOR","SALÃO DE EVENTOS DA IGREJA SANTÍSSIMA TRINDADE","CASA DE CUSTÓDIA DE ARAPONGAS - CCA"];const search=document.getElementById("collegeSearch"),list=document.getElementById("collegeList"),arrow=document.getElementById("collegeArrow");function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}function render(q=""){let x=norm(q.trim()),m=colleges.filter(c=>norm(c).includes(x));list.innerHTML="";if(!m.length)list.innerHTML='<div class="combo-empty">Nenhum colégio encontrado.</div>';else m.forEach(c=>{let d=document.createElement("div");d.className="combo-option";d.textContent=c;d.onclick=()=>{search.value=c;list.classList.remove("open")};list.appendChild(d)})}search.onfocus=()=>{render(search.value);list.classList.add("open")};search.oninput=()=>{render(search.value);list.classList.add("open")};arrow.onclick=()=>{render(search.value);list.classList.toggle("open")};document.addEventListener("click",e=>{if(!document.getElementById("collegeCombo").contains(e.target))list.classList.remove("open")});document.querySelectorAll(".region").forEach(el=>el.onclick=()=>{document.querySelectorAll(".region").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("region").value=el.dataset.value});const phone=document.getElementById("participantPhone");phone.oninput=()=>{let v=phone.value.replace(/\D/g,"").slice(0,11);if(v.length>10)v=v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3");else if(v.length>6)v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3");else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,"($1) $2");phone.value=v};const PUBLIC_KEY="sb_publishable_tXsklaQ9alfe6IfcYd-RhA_NBxIWA15";document.getElementById("teamForm").onsubmit=async e=>{e.preventDefault();const btn=document.getElementById("submitBtn"),msg=document.getElementById("msg"),region=document.getElementById("region").value,colegio=search.value.trim(),nome=document.getElementById("participantName").value.trim(),telefone=phone.value.trim();msg.className="msg";if(!region){msg.textContent="Selecione sua região.";msg.className="msg err";return}if(!colleges.includes(colegio)){msg.textContent="Selecione um colégio da lista.";msg.className="msg err";return}if(nome.length<2){msg.textContent="Informe seu nome completo.";msg.className="msg err";return}if(telefone.replace(/\D/g,"").length<10){msg.textContent="Informe um telefone válido.";msg.className="msg err";return}btn.disabled=true;btn.textContent="Enviando…";try{const r=await fetch("https://dtcvudwmosxhbgpwphsx.supabase.co/functions/v1/team-division-submit",{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLIC_KEY},body:JSON.stringify({region,polling_place:colegio,name:nome,phone:telefone})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw Error(data.error||"Falha no envio");location.replace("obrigado/")}catch(err){console.error(err);msg.textContent="Não foi possível registrar agora. Tente novamente.";msg.className="msg err";btn.disabled=false;btn.textContent="Enviar resposta"}};</script></body></html>
