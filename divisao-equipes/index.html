<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divisão de Equipe Sérgio e Pedro</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{transition:.25s} body.dark{background:#102744;color:#fff} body.light{background:#f4f7fb;color:#142541}
.hero{position:relative;overflow:hidden}.hero img{width:100%;display:block}
.dark .hero,.dark .intro{background:#16365e}.light .hero,.light .intro{background:#f4f7fb}
.dark .hero:after,.light .hero:after{display:none!important;background:none!important}
.intro{text-align:center;padding:0 22px 32px}.intro h1{font-size:clamp(28px,7vw,43px);line-height:1.08;margin:0 0 13px}.intro p{font-size:clamp(17px,4.5vw,22px);line-height:1.35;margin:0}.dark .intro p{color:#e1e8f1}.light .intro p{color:#52627a}
main{padding:28px 18px 44px}.card{max-width:720px;margin:auto;border-radius:24px;padding:24px 18px 20px;box-shadow:0 16px 44px rgba(0,0,0,.22)}.dark .card{background:linear-gradient(145deg,#173a69,#0e2c55);border:1px solid rgba(255,255,255,.12)}.light .card{background:#fff;border:1px solid #dce4ef;box-shadow:0 12px 34px rgba(24,54,90,.12)}
.title{font-size:25px;font-weight:800;margin:0 0 6px}.sub{margin:0 0 20px;font-size:14px}.dark .sub{color:#c9d7e9}.light .sub{color:#66758a}
.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:23px}.region{border:1px solid transparent;border-radius:17px;padding:14px 12px;display:flex;align-items:center;gap:10px;font-weight:750;cursor:pointer;user-select:none;transition:.15s}.dark .region{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}.light .region{background:#f7f9fc;border-color:#e2e8f0}.region.selected{outline:3px solid rgba(72,155,255,.35);border-color:#4d9dff}.dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto}.norte .dot{background:#2674ff}.oeste .dot{background:#9b4dff}.leste .dot{background:#31b96b}.sul .dot{background:#ff8a28}.centro .dot{background:#f4cf28}.centro{grid-column:1/-1}
.field label,.participant-fields label{display:block;font-size:14px;font-weight:750;margin:0 0 8px}.combo{position:relative}.combo-input-wrap{display:flex;border-radius:14px;overflow:hidden}.dark .combo-input-wrap,.dark .participant-fields input{background:#0b2447;border:1px solid rgba(255,255,255,.15)}.light .combo-input-wrap,.light .participant-fields input{background:#fff;border:1px solid #ccd7e5}.combo input{width:100%;border:0;outline:0;padding:14px 13px;font-size:15px;background:transparent;color:inherit}.combo-arrow{width:48px;border:0;background:transparent;color:inherit}.combo-arrow svg{width:21px;fill:none;stroke:currentColor;stroke-width:2}.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:270px;overflow:auto;border-radius:14px;display:none}.combo-list.open{display:block}.dark .combo-list{background:#0d2a51;border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 36px rgba(0,0,0,.35)}.light .combo-list{background:#fff;border:1px solid #d7e0eb;box-shadow:0 16px 36px rgba(20,45,80,.18)}.combo-option,.combo-empty{padding:12px 13px;font-size:13px;line-height:1.25;border-bottom:1px solid rgba(128,145,165,.18)}.combo-option{cursor:pointer}.combo-option:last-child{border-bottom:0}.dark .combo-option:hover{background:#173a69}.light .combo-option:hover{background:#eef4fb}
.participant-fields{margin-top:20px}.participant-fields input{display:block;width:100%;border-radius:14px;outline:0;padding:14px 13px;font-size:15px;color:inherit;margin:0 0 15px}.privacy-note{font-size:12px;line-height:1.4;margin:0 0 20px;opacity:.72}.submit{width:100%;border:0;border-radius:15px;padding:15px 18px;font-size:16px;font-weight:850;background:linear-gradient(180deg,#2688ff,#0866dc);color:white;box-shadow:0 8px 24px rgba(0,111,255,.3);cursor:pointer}.submit:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:12px 13px;border-radius:12px;font-size:13px;line-height:1.35}.msg.ok{display:block;background:rgba(45,190,100,.14);border:1px solid rgba(45,190,100,.35)}.msg.err{display:block;background:rgba(235,74,74,.14);border:1px solid rgba(235,74,74,.35)}
.theme-toggle{position:fixed;right:14px;bottom:14px;z-index:50;border:0;border-radius:999px;width:48px;height:48px;font-size:20px;box-shadow:0 7px 22px rgba(0,0,0,.22)}.hero{margin:0!important;padding:0!important;background:#16365e!important;position:relative!important;overflow:hidden!important}.hero img{display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important;object-fit:contain!important}.hero:before,.hero:after{display:none!important;content:none!important}
@media(max-width:480px){main{padding:20px 12px 34px}.card{padding:20px 14px}.title{font-size:22px}.regions{gap:9px}.region{padding:13px 10px}.intro{padding:0 18px 26px}}
</style></head>
<body class="dark">
<header class="hero"><img src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/083997f2-b3c5-4583-970f-f47d2240f54e.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODhiZTlhNDllMGQzNWQ2MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTcwMzExM30.I8FyTh7bExTRdRS-cBl-mMAxygPAM7dSgi6-8PQZ-vU" alt="Sérgio e Pedro"></header>
<section class="intro"><h1>Divisão de Equipes</h1><p>Selecione a região correspondente e informe seu colégio eleitoral.</p></section>
<main><form id="teamForm" class="card"><h2 class="title">Qual é a sua região?</h2><p class="sub">Selecione apenas uma opção.</p><div class="regions" id="regions"><div class="region norte" data-value="Norte"><span class="dot"></span>Norte</div><div class="region oeste" data-value="Oeste"><span class="dot"></span>Oeste</div><div class="region leste" data-value="Leste"><span class="dot"></span>Leste</div><div class="region sul" data-value="Sul"><span class="dot"></span>Sul</div><div class="region centro" data-value="Centro"><span class="dot"></span>Centro</div></div><input type="hidden" id="region" required>
<div class="field college-field"><label for="collegeSearch">Qual é o seu colégio eleitoral?</label><div class="combo" id="collegeCombo"><div class="combo-input-wrap"><input required id="collegeSearch" name="colegio" type="text" placeholder="Digite para buscar seu colégio" autocomplete="off"><button class="combo-arrow" id="collegeArrow" type="button" aria-label="Abrir lista"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div><div class="combo-list" id="collegeList"></div></div></div>
<div class="participant-fields"><label for="participantName">Nome completo</label><input id="participantName" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" required><label for="participantPhone">Telefone / WhatsApp</label><input id="participantPhone" name="telefone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="(43) 99999-9999" maxlength="15" required><p class="privacy-note">Seus dados serão utilizados para identificação e organização desta pesquisa.</p></div>
<button class="submit" id="submitBtn">Enviar resposta</button><div class="msg" id="msg"></div></form></main>
<button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">☀️</button>
<script>
const colleges=["ESCOLA MUNICIPAL PROFESSORA ANTONICA GIROLDO FRANCIOSI","COLÉGIO ESTADUAL ANTÔNIO RACANELLO SAMPAIO","COLÉGIO ESTADUAL ANTÔNIO GARCEZ NOVAES","ESCOLA MUNICIPAL HELOIZA MARIA VICTORIA PAUMYRA CUROTTO GIANCRISTOFARO","COLÉGIO ESTADUAL PROFESSORA NADIR MENDES MONTANHA","CENTRO PASTORAL DA IGREJA SANTO ANTONIO DE PADUA","ESCOLA MUNICIPAL PRESIDENTE GETÚLIO VARGAS","CLUBE COMERCIAL DE ARAPONGAS","COLÉGIO ESTADUAL FRANCISCO FERREIRA BASTOS","ESCOLA ESTADUAL WALFREDO SILVEIRA CORREIA","ESCOLA MUNICIPAL PROFESSORA ALZIRA HORVATICH","ESCOLA MUNICIPAL JOSE BERNARDO DOS SANTOS","ESCOLA MUNICIPAL PROFESSORA ALEYDAH C.S. OLIVEIRA","ESCOLA MUNICIPAL PROFESSOR JOSE DE CARVALHO","ESCOLA MUNICIPAL DESEMBARGADOR CLOTARIO PORTUGAL","COLÉGIO ESTADUAL IVANILDE DE NORONHA","COLÉGIO ESTADUAL EMILIO DE MENEZES","ESCOLA MUNICIPAL PAPA JOÃO PAULO II","COLÉGIO ESTADUAL UNIDADE POLO","COLÉGIO ESTADUAL MARQUES DE CARAVELAS","ESCOLA MUNICIPAL DE ARICANDUVA","ESCOLA MUNICIPAL PADRE GERMANO MAYER","ESCOLA MUNICIPAL DOUTORA MARIA HERCÍLIA HORÁCIO STAWINSKI","ESCOLA MUNICIPAL PROFESSORA DIOMAR DE OLIVEIRA PEGOER","COLÉGIO ESTADUAL IRONDI MANTOVANI PUGLIESE","ESCOLA MUNICIPAL ENZO BATISTA DALEFFE PEREIRA","COLÉGIO BOM JESUS MÃE DO DIVINO AMOR","SALÃO DE EVENTOS DA IGREJA SANTÍSSIMA TRINDADE","CASA DE CUSTÓDIA DE ARAPONGAS - CCA"];
const search=document.getElementById("collegeSearch"),list=document.getElementById("collegeList"),arrow=document.getElementById("collegeArrow");function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}function render(q=""){let x=norm(q.trim()),m=colleges.filter(c=>norm(c).includes(x));list.innerHTML="";if(!m.length){let d=document.createElement("div");d.className="combo-empty";d.textContent="Nenhum colégio encontrado.";list.appendChild(d)}else m.forEach(c=>{let d=document.createElement("div");d.className="combo-option";d.textContent=c;d.onclick=()=>{search.value=c;list.classList.remove("open")};list.appendChild(d)})}search.addEventListener("focus",()=>{render(search.value);list.classList.add("open")});search.addEventListener("input",()=>{render(search.value);list.classList.add("open")});arrow.onclick=()=>{render(search.value);list.classList.toggle("open")};document.addEventListener("click",e=>{if(!document.getElementById("collegeCombo").contains(e.target))list.classList.remove("open")});document.querySelectorAll(".region").forEach(el=>el.onclick=()=>{document.querySelectorAll(".region").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("region").value=el.dataset.value});
const phone=document.getElementById("participantPhone");phone.addEventListener("input",()=>{let v=phone.value.replace(/\D/g,"").slice(0,11);if(v.length>10)v=v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3");else if(v.length>6)v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3");else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,"($1) $2");phone.value=v});document.getElementById("themeToggle").onclick=()=>{document.body.classList.toggle("dark");document.body.classList.toggle("light");document.getElementById("themeToggle").textContent=document.body.classList.contains("dark")?"☀️":"🌙"};
const SUPABASE_URL="https://dtcvudwmosxhbgpwphsx.supabase.co",SUPABASE_KEY="sb_publishable_tXsklaQ9alfe6IfcYd-RhA_NBxIWA15";document.getElementById("teamForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submitBtn"),msg=document.getElementById("msg"),region=document.getElementById("region").value,colegio=search.value.trim(),nome=document.getElementById("participantName").value.trim(),telefone=phone.value.trim();msg.className="msg";if(!region){msg.textContent="Selecione sua região.";msg.className="msg err";return}if(!colleges.includes(colegio)){msg.textContent="Selecione um colégio da lista.";msg.className="msg err";return}btn.disabled=true;btn.textContent="Enviando…";try{const r=await fetch(`${SUPABASE_URL}/rest/v1/vf_team_division_responses`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({region,polling_place:colegio,name:nome,phone:telefone})});if(!r.ok)throw Error(await r.text());msg.textContent="Obrigado por sua participação. Sua resposta foi registrada.";msg.className="msg ok";e.target.reset();document.getElementById("region").value="";document.querySelectorAll(".region").forEach(x=>x.classList.remove("selected"))}catch(err){console.error(err);msg.textContent="Não foi possível registrar agora. Tente novamente.";msg.className="msg err"}finally{btn.disabled=false;btn.textContent="Enviar resposta"}});
</script></body></html>
