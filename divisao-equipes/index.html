<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Divisão de Equipes</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(155deg,#071a3d,#063b86 48%,#0b69d4);color:#fff;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:22px 16px 42px}.hero{text-align:center;padding:18px 12px}.hero h1{font-size:31px;margin:0 0 7px}.hero p{margin:0;color:#dceaff}.card{background:rgba(5,20,50,.78);border:1px solid rgba(255,255,255,.17);border-radius:22px;padding:20px;box-shadow:0 16px 42px rgba(0,0,0,.28);backdrop-filter:blur(10px)}label{display:block;font-weight:700;margin:15px 0 7px}.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.reg{border:2px solid transparent;border-radius:13px;padding:12px 4px;color:#fff;font-weight:800;cursor:pointer}.reg[data-r=Norte]{background:#1877f2}.reg[data-r=Oeste]{background:#7c3aed}.reg[data-r=Leste]{background:#159447}.reg[data-r=Sul]{background:#e97816}.reg[data-r=Centro]{background:#d3a800}.reg.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}input,select{width:100%;font-size:16px;padding:14px 13px;border-radius:13px;border:1px solid #9ab7e2;background:#fff;color:#14213d;outline:none}button[type=submit]{width:100%;margin-top:20px;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#fff;color:#08489d;cursor:pointer}.msg{display:none;margin-top:15px;padding:13px;border-radius:12px;text-align:center}.ok{background:#0c7b46}.err{background:#a52a2a}.privacy{font-size:12px;line-height:1.45;color:#cbdcf6;margin:13px 2px 0}@media(max-width:570px){.regions{grid-template-columns:repeat(2,1fr)}.regions .reg:last-child{grid-column:1/-1}.hero h1{font-size:27px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Divisão de Equipes</h1><p>Selecione a região correspondente e informe seu colégio eleitoral.</p></header><section class="card"><form id="f" novalidate><label>Região</label><div class="regions" id="regions"><button type="button" class="reg" data-r="Norte">Norte</button><button type="button" class="reg" data-r="Oeste">Oeste</button><button type="button" class="reg" data-r="Leste">Leste</button><button type="button" class="reg" data-r="Sul">Sul</button><button type="button" class="reg" data-r="Centro">Centro</button></div><input id="region" type="hidden">
<label for="place">Colégio eleitoral</label><select id="place" required><option value="">Selecione...</option></select>
<label for="name">Nome completo</label><input id="name" autocomplete="name" minlength="2" maxlength="120" placeholder="Digite seu nome" required>
<label for="phone">Telefone / WhatsApp</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="(43) 99999-9999" required>
<button id="send" type="submit">Enviar participação</button><div id="msg" class="msg"></div><p class="privacy">Os dados informados são destinados ao controle interno desta participação e ficam disponíveis somente à equipe autorizada no painel administrativo.</p></form></section></main><script>
const URL='https://dtcvudwmosxhbgpwphsx.supabase.co',KEY='sb_publishable_tXsklaQ9alfe6IfcYd-RhA_NBxIWA15';
const places=['ESCOLA MUNICIPAL PROFESSORA ANTONICA GIROLDO FRANCIOSI','COLÉGIO ESTADUAL ANTÔNIO RACANELLO SAMPAIO','COLÉGIO ESTADUAL ANTÔNIO GARCEZ NOVAES','ESCOLA MUNICIPAL HELOIZA MARIA VICTORIA PAUMYRA CUROTTO GIANCRISTOFARO','COLÉGIO ESTADUAL PROFESSORA NADIR MENDES MONTANHA','CENTRO PASTORAL DA IGREJA SANTO ANTONIO DE PADUA','ESCOLA MUNICIPAL PRESIDENTE GETÚLIO VARGAS','CLUBE COMERCIAL DE ARAPONGAS','COLÉGIO ESTADUAL FRANCISCO FERREIRA BASTOS','ESCOLA ESTADUAL WALFREDO SILVEIRA CORREIA','ESCOLA MUNICIPAL PROFESSORA ALZIRA HORVATICH','ESCOLA MUNICIPAL JOSE BERNARDO DOS SANTOS','ESCOLA MUNICIPAL PROFESSORA ALEYDAH C.S. OLIVEIRA','ESCOLA MUNICIPAL PROFESSOR JOSE DE CARVALHO','ESCOLA MUNICIPAL DESEMBARGADOR CLOTARIO PORTUGAL','COLÉGIO ESTADUAL IVANILDE DE NORONHA','COLÉGIO ESTADUAL EMILIO DE MENEZES','ESCOLA MUNICIPAL PAPA JOÃO PAULO II','COLÉGIO ESTADUAL UNIDADE POLO','COLÉGIO ESTADUAL MARQUES DE CARAVELAS','ESCOLA MUNICIPAL DE ARICANDUVA','ESCOLA MUNICIPAL PADRE GERMANO MAYER','ESCOLA MUNICIPAL DOUTORA MARIA HERCÍLIA HORÁCIO STAWINSKI','ESCOLA MUNICIPAL PROFESSORA DIOMAR DE OLIVEIRA PEGOER','COLÉGIO ESTADUAL IRONDI MANTOVANI PUGLIESE','ESCOLA MUNICIPAL ENZO BATISTA DALEFFE PEREIRA','COLÉGIO BOM JESUS MÃE DO DIVINO AMOR','SALÃO DE EVENTOS DA IGREJA SANTÍSSIMA TRINDADE','CASA DE CUSTÓDIA DE ARAPONGAS - CCA'];
const sel=document.getElementById('place');places.forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;sel.appendChild(o)});document.querySelectorAll('.reg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.reg').forEach(x=>x.classList.remove('on'));b.classList.add('on');region.value=b.dataset.r});
phone.oninput=()=>{let d=phone.value.replace(/\D/g,'').slice(0,11);phone.value=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d};
function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}
f.onsubmit=async e=>{e.preventDefault();msg.style.display='none';const r=region.value,n=name.value.trim(),p=phone.value.trim(),pd=p.replace(/\D/g,'');if(!r)return show('Selecione uma região.',false);if(!sel.value)return show('Selecione seu colégio eleitoral.',false);if(n.length<2)return show('Informe seu nome.',false);if(pd.length<10||pd.length>11)return show('Informe um telefone/WhatsApp válido.',false);send.disabled=true;send.textContent='Enviando...';try{const res=await fetch(URL+'/rest/v1/vf_team_division_responses',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({region:r,polling_place:sel.value,participant_name:n,participant_phone:p})});if(!res.ok)throw new Error(await res.text());show('Obrigado. Sua participação foi registrada com sucesso.',true);f.reset();region.value='';document.querySelectorAll('.reg').forEach(x=>x.classList.remove('on'))}catch(err){console.error(err);show('Não foi possível registrar agora. Verifique sua conexão e tente novamente.',false)}finally{send.disabled=false;send.textContent='Enviar participação'}};
</script></body></html>
